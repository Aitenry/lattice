  # ==========================================================================
  # §4 Messages
  # ==========================================================================
  /v1/messages:
    post:
      tags: [messages]
      operationId: sendMessage
      summary: HTTP upstream for small messages (≤1MB, semantically equivalent to a WS envelope)
      description: |-
        ⑤ §4.1. The server injects `sender` (any client-supplied `sender` is ignored and audited); `seq` is assigned by the server
        and a request body >1MB returns 413 `TOO_LARGE` + `details.hint=use_ws_or_chunk`.
        Supports `Idempotency-Key` or a body `id` (when both conflict, `id` wins).
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MessageCreateRequest' }
      responses:
        '201':
          description: Message accepted.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MessageCreated' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '413': { $ref: '#/components/responses/TooLarge' }
        '422': { $ref: '#/components/responses/Format' }
        '429': { $ref: '#/components/responses/RateLimited' }
      x-doc-ref: '⑤ §4.1'
      x-idempotency: supported

  /v1/messages/{id}:
    parameters:
      - name: id
        in: path
        required: true
        description: Message ULID.
        schema: { $ref: '#/components/schemas/Ulid' }
    get:
      tags: [messages]
      operationId: getMessageMeta
      summary: Message metadata + delivery summary
      description: ⑤ §4.2. `delivery_summary` is a `delivery_log` summary aggregated per device.
      responses:
        '200':
          description: Message metadata.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MessageMeta' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
      x-doc-ref: '⑤ §4.2'

  /v1/messages/{id}/download:
    parameters:
      - name: id
        in: path
        required: true
        description: Message ULID.
        schema: { $ref: '#/components/schemas/Ulid' }
    get:
      tags: [messages]
      operationId: downloadMessagePayload
      summary: Download a message payload (200 for small messages, 302 to the transfer plane for large objects)
      description: |-
        ⑤ §4.3. Small messages (≤1MB) return the payload directly with 200 (`Content-Type` matches the envelope,
        `Content-Disposition: attachment`); large objects return 302 to the download transfer plane
        (`{transfer.public_base_url}/t/{token}`, or a same-origin `/t/{token}` when
        `public_base_url` is empty: short-lived HMAC capability, `Range`/resume supported) when
        `[transfer] enabled`; otherwise 302 to a legacy MinIO presigned URL (TTL 900s).
        `inspectable` mode is denied by default (requires an explicit admin action plus an audit trail).
      responses:
        '200':
          description: Inline payload bytes.
          headers:
            Content-Disposition:
              description: '`attachment`'
              schema: { type: string }
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        '302':
          description: Redirect to the transfer plane (`/t/{token}`) or, when the transfer plane is disabled, to a MinIO presigned URL (TTL 900s).
          headers:
            Location: { $ref: '#/components/headers/Location' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
      x-doc-ref: '⑤ §4.3'

  /v1/chunks/{msg_id}:
    parameters:
      - name: msg_id
        in: path
        required: true
        description: Message ULID.
        schema: { $ref: '#/components/schemas/Ulid' }
    get:
      tags: [messages]
      operationId: fetchMissingChunks
      summary: Server-side chunk recovery (retransmission list for missing chunks)
      description: |-
        ⑤ §4.4. `?missing=3,7` selects missing chunk indexes (omitted = all); returns a chunk inventory
        of `{idx, size, checksum, presigned_url?}`, or reuses the WS `chunk` downstream.
        `presigned_url` follows the same `[transfer]` switch as other downloads (transfer-plane capability URL
        when enabled, legacy MinIO presign when disabled).
        Chunk envelopes are not stored in `messages` and are not assigned a `seq`.
      parameters:
        - name: missing
          in: query
          required: false
          description: Missing chunk index list (comma-separated).
          schema:
            type: array
            items: { type: integer, minimum: 0 }
          style: form
          explode: false
      responses:
        '200':
          description: Chunk inventory.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ChunksResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Format' }
      x-doc-ref: '⑤ §4.4'

  # ==========================================================================
  # §5 Uploads (large objects / MinIO Multipart)
  # ==========================================================================
  /v1/uploads:
    post:
      tags: [uploads]
      operationId: createUpload
      summary: Request an upload session (issues presigned part URLs)
      description: |-
        ⑤ §5.1. `part_size` is fixed at 8MB (any other value → 422); presigned URLs have a 900s TTL and after expiry can be
        reissued for unfinished parts via `POST /v1/uploads/{id}/parts` (idempotent).
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UploadCreateRequest' }
      responses:
        '201':
          description: Upload session.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UploadCreated' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '413': { $ref: '#/components/responses/TooLarge' }
        '422': { $ref: '#/components/responses/Format' }
        '429': { $ref: '#/components/responses/RateLimited' }
      x-doc-ref: '⑤ §5.1'
      x-idempotency: supported

  /v1/uploads/{id}:
    parameters:
      - name: id
        in: path
        required: true
        description: Upload session ULID.
        schema: { $ref: '#/components/schemas/Ulid' }
    get:
      tags: [uploads]
      operationId: getUploadProgress
      summary: Query upload progress (completed parts) → resumable upload
      description: ⑤ §5.3. Readable only by the session creator and admin.
      responses:
        '200':
          description: Upload progress.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UploadProgress' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
      x-doc-ref: '⑤ §5.3'
    delete:
      tags: [uploads]
      operationId: abortUpload
      summary: Abort an upload (cleans up uploaded parts)
      description: ⑤ §5.3.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '204': { description: Aborted (empty body). }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
      x-doc-ref: '⑤ §5.3'
      x-idempotency: supported

  /v1/uploads/{id}/complete:
    parameters:
      - name: id
        in: path
        required: true
        description: Upload session ULID.
        schema: { $ref: '#/components/schemas/Ulid' }
    post:
      tags: [uploads]
      operationId: completeUpload
      summary: Complete an upload (merge parts, create a file Envelope, and deliver it)
      description: |-
        ⑤ §5.2. Completion verifies the overall `sha256`; a mismatch → 422 FORMAT and the object is deleted;
        success returns 201 and creates a `file` type Envelope (`payload_ref`) delivered through the normal path.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UploadCompleteRequest' }
      responses:
        '201':
          description: Upload completed and delivered.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UploadCompleted' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Format' }
        '429': { $ref: '#/components/responses/RateLimited' }
      x-doc-ref: '⑤ §5.2'
      x-idempotency: supported

  /v1/uploads/{id}/parts:
    parameters:
      - name: id
        in: path
        required: true
        description: Upload session ULID.
        schema: { $ref: '#/components/schemas/Ulid' }
    post:
      tags: [uploads]
      operationId: reissueUploadParts
      summary: Reissue presigned URLs for unfinished parts (idempotent)
      description: ⑤ §5.3. Refreshes the upload session TTL and issues URLs only for unfinished parts.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: New part URLs.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UploadCreated' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
      x-doc-ref: '⑤ §5.3'
      x-idempotency: supported

  # ==========================================================================
  # §7 Topic subscriptions and broadcasts
  # ==========================================================================
  /v1/topics:
    get:
      tags: [topics]
      operationId: listTopics
      summary: My subscriptions + unread offset deltas
      description: ⑤ §7. Subscriptions are `conversation_members` rows for `conversations(kind='topic')`.
      responses:
        '200':
          description: Subscription list.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TopicList' }
        '401': { $ref: '#/components/responses/Unauthorized' }
