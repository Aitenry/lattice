  /v1/admin/keys/rotate:
    post:
      tags: [admin]
      operationId: adminRotateKeys
      summary: Key rotation (dual-key overlap window; target=jwt really generates RSA 2048)
      description: |-
        ⑤ §8.4. `target=jwt` really generates 2048-bit RSA, writes to disk atomically, and hot-swaps, returning
        `{implemented:true,status:"rotated",...}`; `kek`/`internal_ca` still return
        `implemented:false,status:"not_implemented"`; a read-only key directory → 500 + `details.reason=key_dir_readonly`.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AdminKeyRotateRequest' }
