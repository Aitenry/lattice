      description: '⑤ §8.1. Role: user (read-only).'
      responses:
        '200':
          description: Node list.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminNodeList' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
      x-doc-ref: '⑤ §8.1'

  /v1/admin/nodes/{id}/drain:
    parameters:
      - name: id
        in: path
        required: true
        description: Node ID (`state.node_id`).
        schema: { type: string }
    post:
      tags: [admin]
      operationId: adminNodeDrainStart
      summary: Drain a node from rotation (returns task id / 202)
      description: |-
        ⑤ §8.1. Role: ops. Setting draining → this node sends `byef{reason=shutdown}` to all online connections,
        `/v1/ready` turns 503, and `/v1/ws` rejects new connections (503 + `details.reason=draining`).
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AdminDrainRequest' }
      responses:
        '202':
          description: Accepted.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminDrainStatus' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Format' }
      x-doc-ref: '⑤ §8.1'
      x-idempotency: supported
    get:
      tags: [admin]
      operationId: adminNodeDrainProgress
      summary: Drain progress (remaining connections / byef count)
      description: '⑤ §8.1. Role: user (read-only).'
      responses:
        '200':
          description: Drain progress.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminDrainStatus' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
