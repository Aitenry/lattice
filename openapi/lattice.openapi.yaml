  # ==========================================================================
  # §9.7 / §8.4 Media helpers (TURN short-lived credentials, recording search)
  # ==========================================================================
  /v1/media/turn-credentials:
    get:
      tags: [media]
      operationId: mediaTurnCredentials
      summary: Issue short-lived coturn REST API credentials (any signed-in role)
      description: |-
        ⑤ §9.7. When `enabled=false` (no `[media] turn_uris/turn_secret` configured), returns
        `{enabled:false, uris:[], ttl:0}` — **not an error** (the client falls back to a direct connection/tunnel).
        Credential TTL defaults to 600s and the server truncates it to ≤600s; does not write `delivery_log`, does not count against message quota, and does not write audit.
      responses:
        '200':
          description: Credentials (or disabled).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TurnCredentials' }
        '401': { $ref: '#/components/responses/Unauthorized' }
      x-doc-ref: '⑤ §9.7'

  /v1/media/recordings:
    get:
      tags: [media]
      operationId: mediaRecordings
      summary: Recording segment index (filter by stream, reverse cursor pagination)
      description: |-
        ⑤ §9.7. Role: admin/ops (user → 403, anonymous → 401). The list contains no payload/URL;
        `before` is the previous page `next_before` (recording id); an unknown cursor → 422.
      parameters:
        - name: stream_id
          in: query
          required: false
          description: Filter by stream (exact match; omitted = all recent recordings).
          schema: { type: string }
        - name: limit
          in: query
          required: false
          description: Page size (default 50, max 200; out-of-range values are clamped).
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
        - name: before
          in: query
          required: false
          description: Cursor (previous page `next_before`, a recording id).
          schema: { $ref: '#/components/schemas/Ulid' }
      responses:
        '200':
          description: Recording segment page.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RecordingList' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/Format' }
      x-doc-ref: '⑤ §9.7'

  /v1/media/recordings/{id}:
    parameters:
      - name: id
        in: path
        required: true
        description: Recording segment ULID.
        schema: { $ref: '#/components/schemas/Ulid' }
    get:
      tags: [media]
      operationId: mediaRecordingDetail
      summary: Recording segment metadata + download URL (transfer plane capability, or legacy presigned URL)
      description: |-
        ⑤ §9.7. Role: admin/ops. `presigned_url` is the object's download URL: with `[transfer] enabled` it is a
        transfer-plane capability URL; otherwise a legacy MinIO presigned URL. `presign_ttl_seconds` reports the
        effective lifetime of that URL.
      responses:
        '200':
          description: Recording segment details.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RecordingDetail' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
      x-doc-ref: '⑤ §9.7'

  /v1/media/recordings/{id}/download:
    parameters:
      - name: id
        in: path
        required: true
        description: Recording segment ULID.
        schema: { $ref: '#/components/schemas/Ulid' }
    get:
      tags: [media]
      operationId: mediaRecordingDownload
      summary: Download a recording segment (302 to the transfer plane; audit media.recording.download)
      description: |-
        ⑤ §9.7. Role: admin/ops; unknown id → 404, user → 403. With `[transfer] enabled` the 302 points at the
        transfer plane (`/t/{token}`); otherwise at a legacy MinIO presigned URL.
      responses:
        '302':
          description: Redirect to the transfer plane (`/t/{token}`) or a legacy MinIO presigned GET.
          headers:
            Location: { $ref: '#/components/headers/Location' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
      x-doc-ref: '⑤ §9.7'

  /v1/media/recordings/{id}/manifest:
    parameters:
      - name: id
        in: path
        required: true
        description: Recording segment ULID.
        schema: { $ref: '#/components/schemas/Ulid' }
    get:
      tags: [media]
      operationId: mediaRecordingManifest
      summary: Recording segment frame-index manifest (raw-frames; no payload, not directly playable)
      description: '⑤ §8.4/§9.7. Role: admin/ops; legacy rows (no manifest object) → 404.'
      responses:
        '200':
          description: manifest JSON.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RecordingManifest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
      x-doc-ref: '⑤ §9.7'

  # ==========================================================================
  # §12 Plugin hub (user-facing /v1/hub)
  # ==========================================================================
  /v1/hub/plugins:
    get:
      tags: [hub]
      operationId: hubListPlugins
      summary: Plugin catalog (published only, with at least one published version)
      description: |-
        ⑤ §12.1. Any signed-in user. `installed`/`installed_version`/`update_available` are caller-scoped
        view fields (from `hub_plugin_installs`, not global plugin attributes). `q` matches
        name/description/plugin_id/tags (case-insensitive).
      parameters:
        - name: q
          in: query
          required: false
          schema: { type: string }
        - name: category
          in: query
          required: false
          schema: { type: string }
        - name: sort
          in: query
          required: false
          schema: { type: string, enum: [recent, popular, name], default: recent }
        - name: page
          in: query
          required: false
          schema: { type: integer, minimum: 1, default: 1 }
        - name: page_size
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
      responses:
        '200':
          description: Catalog page.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HubPluginPage' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/Format' }
      x-doc-ref: '⑤ §12.1'
    post:
      tags: [hub]
      operationId: hubPublishPlugin
      summary: 'Publish (create plugin / add version): 201 draft + upload target'
      description: |-
        ⑤ §12.3. Any signed-in user; for an existing `plugin_id`, only the owner or admin can add versions,
        otherwise 403 (`details.reason=not_owner`). Rate limit: 10 per hour (429 `details.reason=hub_publish`).
        A retry with the same `(plugin_id, version)` and sha256 returns 200 (`idempotent_reused=true`);
        an already-published version with the same sha returns 200 (`idempotent=true`, `upload:null`), and a
        version already waiting for review returns 200 with `submitted=true`.
        **Review policy (2026-11-23):** a draft only becomes visible to other users after the package upload
        (`review`) **and** an administrator's approval (`published`); a different sha for a version under review
        is rejected with 409 `version_in_review`, and a removed version cannot be revived (409 `version_removed`).
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/HubPublishRequest' }
      responses:
        '200':
          description: Idempotent retry (same version, same sha).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HubPublishResponse' }
        '201':
          description: New draft created (the package has not been uploaded yet).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HubPublishResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Format' }
        '429': { $ref: '#/components/responses/RateLimited' }
      x-doc-ref: '⑤ §12.3'
      x-idempotency: supported

  /v1/hub/plugins/{plugin_id}:
    parameters:
      - name: plugin_id
        in: path
        required: true
        description: Plugin ID (`^[a-z0-9][a-z0-9._-]{1,63}$`).
        schema: { type: string, pattern: '^[a-z0-9][a-z0-9._-]{1,63}$' }
    get:
      tags: [hub]
      operationId: hubPluginDetail
      summary: Plugin details (published versions for other users; owner/admin also see review states)
      description: |-
        ⑤ §12.2. Not found (or `status=removed` and not owner/admin) → 404; `my_install` is always present
        (null when not installed); `versions` are ordered by `published_at desc`.
        A non-owner only ever receives `status=published` rows; the owner and admins additionally see
        `review`/`rejected`/`pending` rows together with `review_note`/`reviewed_at`/`submitted_at`.
      responses:
        '200':
          description: Plugin details.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HubPluginDetail' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
      x-doc-ref: '⑤ §12.2'
    delete:
      tags: [hub]
      operationId: hubDeletePlugin
      summary: Mark a plugin as removed (owner / admin)
      description: |-
        ⑤ §12.6. The plugin moves to `removed` together with all of its versions; install records are kept; 204;
        writes audit `hub.plugin.remove`.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '204': { description: Deleted (empty body). }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
      x-doc-ref: '⑤ §12.6'
      x-idempotency: supported

  /v1/hub/plugins/{plugin_id}/versions/{version}:
    parameters:
      - name: plugin_id
        in: path
        required: true
        schema: { type: string }
      - name: version
        in: path
        required: true
        description: semver.
        schema: { type: string }
    delete:
      tags: [hub]
      operationId: hubDeleteVersion
      summary: Mark a version as removed (owner / admin)
      description: |-
        ⑤ §12.6. The object is kept for 30 days for rollback; deleting the latest version moves `latest_version` back to the highest remaining version;
        with no versions left → the plugin is hidden from the catalog. 204; writes audit `hub.version.remove`.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '204': { description: Deleted (empty body). }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
      x-doc-ref: '⑤ §12.6'
      x-idempotency: supported

  /v1/hub/plugins/{plugin_id}/versions/{version}/blob:
    parameters:
      - name: plugin_id
        in: path
        required: true
        schema: { type: string }
      - name: version
        in: path
        required: true
        schema: { type: string }
    put:
      tags: [hub]
      operationId: hubUploadBlob
      summary: Upload the installation package body (raw bytes ≤20MiB); the version then waits for review
      description: |-
        ⑤ §12.4. Required headers: `X-Content-SHA256` (must match the `sha256` sent in POST) and `Content-Length`.
        Validation failure → 422 (`details.reason ∈ {checksum, package}`); for a published version, the same sha → 200,
        a different sha → 409 `version_published`. Writes to the `lattice-plugins` bucket.
        **Review policy:** a successful upload moves the version `pending → review`; it is invisible/uninstallable
        for other users until `POST .../approve` succeeds. A retry while the same sha is already in review → 200.
        A version under review with a different sha → 409 `version_in_review`.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - name: X-Content-SHA256
          in: header
          required: true
          description: Package content SHA-256 (lowercase hex).
          schema: { type: string, pattern: '^[0-9a-f]{64}$' }
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema: { type: string, format: binary }
      responses:
        '200':
          description: Stored and waiting for review (or already approved on an idempotent retry).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HubBlobUploadResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '413': { $ref: '#/components/responses/TooLarge' }
        '422': { $ref: '#/components/responses/Format' }
        '429': { $ref: '#/components/responses/RateLimited' }
      x-doc-ref: '⑤ §12.4'
      x-idempotency: supported

  /v1/hub/plugins/{plugin_id}/versions/{version}/download:
    parameters:
      - name: plugin_id
        in: path
        required: true
        schema: { type: string }
      - name: version
        in: path
        required: true
        schema: { type: string }
    get:
      tags: [hub]
      operationId: hubDownloadVersion
      summary: Download the installation package (302 to the transfer plane; legacy MinIO presign when disabled)
      description: |-
        ⑤ §12.5. With `[transfer] enabled` the response is `302 {transfer.public_base_url}/t/{token}`
        (or a same-origin `/t/{token}` when `public_base_url` is empty): the token is a
        short-lived HMAC capability for exactly this object and is served by `lattice-transfer`, which streams the
        package with `Range`/`If-Range` support (clients never need to reach the object store). With the transfer plane
        disabled the response is the legacy `302 → [s3] public_endpoint` presigned GET.
        Both variants include `X-Content-SHA256`/`X-Content-Length`; a missing or removed version → 404;
        the `downloads` counter is best-effort.
        Only `published` versions are downloadable by other users; the owner and admins may also fetch
        `review`/`rejected` versions (their previews do not increment `downloads`).
      responses:
        '302':
          description: Redirect to the transfer plane (`/t/{token}`) or a legacy MinIO presigned GET.
          headers:
            Location: { $ref: '#/components/headers/Location' }
            X-Content-SHA256: { $ref: '#/components/headers/XContentSha256' }
            X-Content-Length: { $ref: '#/components/headers/XContentLength' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
      x-doc-ref: '⑤ §12.5'

  /v1/hub/plugins/{plugin_id}/versions/{version}/source:
    parameters:
      - name: plugin_id
        in: path
        required: true
        schema: { type: string }
      - name: version
        in: path
        required: true
        schema: { type: string }
    get:
      tags: [hub]
      operationId: hubDownloadSource
      summary: Download the source package (302 to the transfer plane; no source → 404 source_missing)
      description: |-
        ⑤ §12.4.2. Visibility follows the same rule as package downloads (`published` for other users;
        owner/admin also `review`/`rejected`); source downloads do **not** count toward `downloads`.
        Delivery follows the same `[transfer]` switch as package downloads: transfer-plane capability URL when
        enabled, legacy MinIO presign when disabled.
      responses:
        '302':
          description: Redirect to the transfer plane (`/t/{token}`) or a legacy MinIO presigned GET.
          headers:
            Location: { $ref: '#/components/headers/Location' }
            X-Content-SHA256: { $ref: '#/components/headers/XContentSha256' }
            X-Content-Length: { $ref: '#/components/headers/XContentLength' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
      x-doc-ref: '⑤ §12.4.2'
    put:
      tags: [hub]
      operationId: hubUploadSource
      summary: Upload the source package (raw zip ≤50MiB, owner/admin)
      description: |-
        ⑤ §12.4.1. Required header `X-Content-SHA256` (must equal `source.sha256` from POST); if no
        `source{}` was declared → 422 `source_not_declared`; validation failure → 422 (`size`/`checksum`/`package`);
        with existing source: the same sha → 200 (`idempotent=true`), a different sha → 409 `source_published`.
        Allowed while the version is `pending`/`review`/`rejected`; a `published` version is immutable and
        rejects source uploads with 409 `version_published` (submit a new version instead).
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - name: X-Content-SHA256
          in: header
          required: true
          description: Source package SHA-256 (lowercase hex).
          schema: { type: string, pattern: '^[0-9a-f]{64}$' }
      requestBody:
        required: true
        content:
          application/zip:
            schema: { type: string, format: binary }
      responses:
        '200':
          description: Object stored (or idempotent hit).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HubSourceUploadResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '413': { $ref: '#/components/responses/TooLarge' }
        '422': { $ref: '#/components/responses/Format' }
        '429': { $ref: '#/components/responses/RateLimited' }
      x-doc-ref: '⑤ §12.4.1'
      x-idempotency: supported

  /v1/hub/installs:
    get:
      tags: [hub]
      operationId: hubListInstalls
      summary: Install record list (per user; data snapshots included when include_data=1)
      description: ⑤ §12.7. The `plugin` field is null when the plugin is removed or does not exist.
      parameters:
        - name: include_data
          in: query
          required: false
          description: 1 = also return the plugin data snapshot (≤256KiB JSON).
          schema: { type: integer, enum: [0, 1], default: 0 }
      responses:
        '200':
          description: Install record page.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HubInstallPage' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/Format' }
      x-doc-ref: '⑤ §12.7'

  /v1/hub/installs/{plugin_id}:
    parameters:
      - name: plugin_id
        in: path
        required: true
        schema: { type: string }
    put:
      tags: [hub]
      operationId: hubUpsertInstall
      summary: Upsert an install record (idempotent, per user)
      description: |-
        ⑤ §12.7. No record → 201 (`data_rev` starts at 1); `data` omitted → 200, updating only
        version/enabled; `data` present with a matching `data_rev` → 200 (the server does `data_rev += 1`); a mismatch →
        409 `data_conflict`; `?force=1` overrides explicitly (must be confirmed by the user).
        A `version` in the body must name an **approved (`published`)** version; otherwise 404
        `details.reason=version_not_published` (review semantics: submit ≠ usable).
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - name: force
          in: query
          required: false
          description: 1 = force-overwrite conflicts (after explicit user confirmation).
          schema: { type: integer, enum: [0, 1], default: 0 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/HubInstallUpsertRequest' }
      responses:
        '200':
          description: Updated.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HubInstall' }
        '201':
          description: Created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HubInstall' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Format' }
      x-doc-ref: '⑤ §12.7'
      x-idempotency: supported
    delete:
      tags: [hub]
      operationId: hubDeleteInstall
      summary: Delete a cloud install record (user-initiated removal; 204)
      description: ⑤ §12.7. Writes audit `hub.install.remove`.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '204': { description: Deleted (empty body). }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
      x-doc-ref: '⑤ §12.7'
      x-idempotency: supported

  /v1/hub/mine:
    get:
      tags: [hub]
      operationId: hubMyPlugins
      summary: My plugins including submissions that are not approved yet
      description: |-
        Any signed-in user. Unlike the catalog (`/v1/hub/plugins`, approved content only), this returns
        every plugin owned by the caller with `state` (`published` / `review` / `rejected` / `pending`)
        and the latest review metadata, so an owner can follow or fix a submission. Removed plugins are excluded.
      responses:
        '200':
          description: Owner's plugins.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HubMyPluginPage' }
        '401': { $ref: '#/components/responses/Unauthorized' }
      x-doc-ref: '⑤ §12'

  /v1/admin/hub/reviews:
    get:
      tags: [hub, admin]
      operationId: adminHubReviewList
      summary: Versions waiting for administrator review (admin only)
      description: |-
        Product rule 2026-11-23: every user-published plugin version requires administrator approval before
        other users can see, download or install it. Oldest submission first. Admin only (ops gets 403).
      parameters:
        - name: page
          in: query
          required: false
          schema: { type: integer, minimum: 1, default: 1 }
        - name: page_size
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
      responses:
        '200':
          description: Review queue page.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HubReviewPage' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
      x-doc-ref: '⑤ §12 (review extension)'

  /v1/admin/hub/plugins/{plugin_id}/versions/{version}/approve:
    parameters:
      - name: plugin_id
        in: path
        required: true
        schema: { type: string }
      - name: version
        in: path
        required: true
        schema: { type: string }
    post:
      tags: [hub, admin]
      operationId: adminHubApproveVersion
      summary: Approve a submitted version (review → published; admin only)
      description: |-
        Publishes the version, applies its catalog-field snapshot to the plugin and recomputes
        `latest_version` by semver. Idempotent when the version is already published. A version that is not
        in `review` → 409 `not_in_review` (`details.status`). Writes audit `hub.version.approve`.
      responses:
        '200':
          description: Approved.
          content:
            application/json:
              schema:
                type: object
                properties:
                  plugin_id: { type: string }
                  version: { type: string }
                  status: { type: string, enum: [published] }
                  published_at: { $ref: '#/components/schemas/Timestamp' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
      x-doc-ref: '⑤ §12 (review extension)'
      x-idempotency: supported

  /v1/admin/hub/plugins/{plugin_id}/versions/{version}/reject:
    parameters:
      - name: plugin_id
        in: path
        required: true
        schema: { type: string }
      - name: version
        in: path
        required: true
        schema: { type: string }
    post:
      tags: [hub, admin]
      operationId: adminHubRejectVersion
      summary: Reject a submitted version (review → rejected; admin only)
      description: |-
        Requires `reason` (1-500 chars), stored as the version's `review_note`; the publisher may correct and
        resubmit the same version. A version that is not in `review` → 409 `not_in_review`.
        Writes audit `hub.version.reject`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/HubRejectRequest' }
      responses:
        '200':
          description: Rejected.
          content:
            application/json:
              schema:
                type: object
                properties:
                  plugin_id: { type: string }
                  version: { type: string }
                  status: { type: string, enum: [rejected] }
                  review_note: { $ref: '#/components/schemas/NullableString' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Format' }
      x-doc-ref: '⑤ §12 (review extension)'

  /v1/hub/stats:
    get:
      tags: [hub]
      operationId: hubStats
      summary: Console statistics (catalog / installs / downloads / storage overview)
      description: |-
        ⑤ §12.8. Role: user (read-only). `storage_bytes` sums `hub_plugin_versions.size`
        (a display value; may briefly diverge from actual bucket usage).
      responses:
        '200':
          description: Statistics.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HubStats' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
      x-doc-ref: '⑤ §12.8'

  # ==========================================================================
  # §9 WebSocket main channel (HTTP upgrade entry; frame protocol in the x-ws extension)
  # ==========================================================================
  /v1/ws:
    get:
      tags: [ws]
      operationId: wsUpgrade
      summary: WebSocket upgrade endpoint (frame protocol in x-ws, 13 commands total)
      description: |-
        ⑤ §9. After TLS + WS Upgrade, the first frame must be `hello{protocol, device_fp, profile, caps}`
        (a JSON frame), otherwise `error{code=PROTOCOL}` + close. In the hello response the server returns the authoritative
        `chunk.threshold_max`, `quota`, and `node_id`. While draining/not ready it returns 503
        (`details.reason=draining`).
      security: []
      responses:
        '101':
          description: Protocol upgrade succeeded (Lattice WS frame protocol follows).
          headers:
            Upgrade:
              description: '`websocket`'
              schema: { type: string }
            Connection:
              description: '`Upgrade`'
              schema: { type: string }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
      x-doc-ref: '⑤ §9'

# ==========================================================================
# Non-HTTP protocol boundary registry (not REST operations; kept in top-level extensions so the contract inventory is complete)
# ==========================================================================
x-ws:
  path: /v1/ws
  frame-format: '[1B ver=1][1B cmd][4B len BE][body]'
  transport: WebSocket over TLS (LB terminates)
  frame-limits:
    envelope: 524288
    chunk: 524288
    stream-data: 65536
  commands:
    - { name: hello, direction: 'C→S / S→C', body: 'JSON {protocol:{min,max}, device_fp, profile, caps, chunk_limit?}' }
    - { name: byef, direction: 'S→C / C→S', body: 'JSON {reason: logout|rotate|shutdown}' }
    - { name: envelope, direction: 'bidirectional', body: 'Envelope(protobuf)' }
    - { name: chunk, direction: 'bidirectional', body: 'Envelope(protobuf) + chunks{total,index,size,checksum}' }
    - { name: ack, direction: 'bidirectional', body: 'JSON {id, state, conv_id?} (device-level acknowledgment)' }
    - { name: receipt, direction: 'bidirectional', body: 'JSON {id, state, conv_id?} (lifecycle receipt)' }
    - { name: ping, direction: 'bidirectional', body: 'empty (30s period; replies with pong on receipt)' }
    - { name: pong, direction: 'bidirectional', body: 'empty' }
    - { name: keepalive, direction: 'bidirectional', body: 'JSON {seq_watermark:{conv_id:seq}} (25s period)' }
    - { name: stream-sig, direction: 'bidirectional', body: 'Envelope(type=stream-sig), payload JSON {stream_id, action, to_user, to_devices?, ...}' }
    - { name: stream-data, direction: 'bidirectional', body: '[1B ver=1][1B flags][2B stream_id_len][stream_id][payload] (≤64KB)' }
    - { name: request-chunks, direction: 'bidirectional', body: 'JSON {id, missing_index[]}' }
    - { name: error, direction: 'bidirectional', body: 'JSON {code, message, envelope_id?}' }
  error-codes: [AUTH_FAIL, PROTOCOL, QUOTA, NOT_FOUND, FORMAT, PLUGIN, RATE, INTERNAL]
  heartbeat:
    ws-ping: '30s (the server replies with pong on receipt)'
    keepalive: '25s (carries the seq watermark)'
    server-dead: '90s without frames → disconnect and clean up conn:*'

x-mqtt-gateway:
  note: >-
    MQTT is not an HTTP interface and has no OpenAPI operations; only topic mapping and boundaries are registered (⑤ §11).
  listener:
    prod: '8883 (TLS, terminated by the fronting proxy)'
    dev: '1883 (plaintext)'
  topic-mapping: 'lattice/{topic}/{device} ↔ Lattice Topic; $share is not supported; the device segment must equal the connected device'
  payload: 'defaults to type=custom:iot and encoding=raw; when the MQTT5 Content-Type property is present, mapping follows the MIME type'
  qos: 'QoS1 targets at-least-once, but the current implementation only guarantees the online round trip; QoS2 is not supported (DISCONNECT 0x9B)'
  auth: 'CONNECT password = the device refresh token (matched against devices.token_hash); X.509 is not implemented'
  rate-limit: '10 msg/s per device; MQTT5 QoS1 over-limit replies with PUBACK 0x97, QoS0/3.1.1 connections are disconnected'
  known-limits: 'the pending queue is not replayed (MQTT-only subscribers get queued messages with no consumer); inbound traffic is not stored in messages'

x-grpc-services:
  note: >-
    Internal gRPC (mTLS) is not an HTTP interface and has no OpenAPI operations; only services and implementation status are registered (⑤ §10).
  services:
    - name: lattice.internal.v1.NodeInternal
      methods:
        - { name: Route, timeout: 2s, failure: 'retry twice → message moves to pending and an alert fires' }
        - { name: FetchChunks, timeout: 10s, failure: 'returns error{FORMAT}; the message is marked expired' }
        - { name: Heartbeat, timeout: 1s, failure: '3 consecutive failures → the node is marked unhealthy' }
        - { name: WatermarkSync, timeout: 3s, failure: 'keeps the local watermark and retries next cycle' }
    - name: lattice.internal.v1.PluginSidecar
      methods:
        - { name: Process, timeout: 500ms, failure: 'the plugin circuit opens for 30s; messages pass through as if no converter existed' }
        - { name: Health, timeout: 1s, failure: 'same as above' }

