  /v1/topics/{t}/subscribe:
    parameters:
      - name: t
        in: path
        required: true
        description: Topic name.
        schema: { type: string }
    post:
      tags: [topics]
      operationId: subscribeTopic
      summary: Subscribe to a topic (idempotent, 200)
      description: ⑤ §7. Subscription cap is 100 per user (429 `details.reason=topic_quota`).
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Subscribed (repeat calls return the current state).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TopicSubscription' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/Format' }
        '429': { $ref: '#/components/responses/RateLimited' }
      x-doc-ref: '⑤ §7'
      x-idempotency: supported

  /v1/topics/{t}/unsubscribe:
    parameters:
      - name: t
        in: path
        required: true
        description: Topic name.
        schema: { type: string }
    post:
      tags: [topics]
      operationId: unsubscribeTopic
      summary: Unsubscribe from a topic (idempotent)
      description: ⑤ §7.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Unsubscribed.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TopicUnsubscribeResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
      x-doc-ref: '⑤ §7'
      x-idempotency: supported

  /v1/topics/{t}/history:
    parameters:
      - name: t
        in: path
        required: true
        description: Topic name.
        schema: { type: string }
    get:
      tags: [topics]
      operationId: topicHistory
      summary: Broadcast history replay (by (user, topic) watermark)
      description: '⑤ §7. `?after_offset=&limit=` (design §18 D6: watermark per user per topic by default).'
      parameters:
        - name: after_offset
          in: query
          required: false
          schema: { type: integer, format: int64 }
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: History page.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TopicHistory' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/Format' }
      x-doc-ref: '⑤ §7'

  /v1/topics/{t}/publish:
    parameters:
      - name: t
        in: path
        required: true
        description: Topic name.
        schema: { type: string }
    post:
      tags: [topics]
      operationId: publishTopic
      summary: Operational broadcast (admin / ops only)
      description: ⑤ §7. Applications should prefer WS `envelope{to_topic}`; this endpoint is for operational broadcasts (such as maintenance notices).
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TopicPublishRequest' }
      responses:
        '200':
          description: Published.
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { $ref: '#/components/schemas/Ulid' }
