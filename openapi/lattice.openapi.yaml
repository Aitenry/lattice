      tags: [admin]
      operationId: adminAudit
      summary: Audit query (offset-based pagination; high-selectivity filter or ≤7-day window required)
      description: |-
        ⑤ §8.6. `from`/`to` are RFC 3339; defaults are `from = now-24h` and `to = now`. At least one of
        `actor`/`action`/`target` or an explicit time window ≤ 7 days is required; otherwise 422 `FORMAT`
        (`details.reason=too_broad`). Results are ordered by `created_at desc`.
      parameters:
        - name: actor
          in: query
          required: false
          schema: { type: string }
        - name: action
          in: query
          required: false
          schema: { type: string }
        - name: target
          in: query
          required: false
          schema: { type: string }
        - name: from
          in: query
          required: false
          schema: { type: string, format: date-time }
        - name: to
          in: query
          required: false
          schema: { type: string, format: date-time }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Audit page.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminAuditPage' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/Format' }
      x-doc-ref: '⑤ §8.6'

  # ---- §8.4 Plugins, formats, config, keys -----------------------------------
  /v1/admin/plugins:
