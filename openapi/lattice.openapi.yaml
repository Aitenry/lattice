      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AdminConfigPatchRequest' }
      responses:
        '200':
          description: Updated config snapshot.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminConfigSnapshot' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/Format' }
      x-doc-ref: '⑤ §8.4'
