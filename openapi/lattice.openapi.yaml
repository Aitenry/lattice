openapi: 3.1.0
jsonSchemaDialect: https://json-schema.org/draft/2020-12/schema
info:
  title: Lattice Platform API (Unified Messaging Platform)
  version: 0.1.0
  summary: Machine-readable contract for all REST/SSE/probe routes in Doc ⑤ (with WS/MQTT/gRPC boundary registrations)
  description: |-
    The **machine-readable authoritative artifact** for the Lattice platform API contract, mapping one-to-one to
    the platform API design document (Doc ⑤, v0.19; maintained outside this repository).

    ## Authority boundary

    - Doc ⑤ remains the sole authority for the human-readable contract; this file is its equivalent machine-readable form, used for client SDK
      generation, CI contract comparison (`python scripts/openapi-diff.py`), and gateway validation.
    - If the two differ: **Doc ⑤ wins**, and this file must be backfilled (changing only this file is not allowed).
    - This file is **not** generated from Rust route macros/utoipa: the axum route macros stay unchanged and no heavyweight
      generation dependency was introduced; when routes change, this file must be edited by hand in the same commit, otherwise `scripts/openapi-diff.py` reports
      missing/extra.
    - Value conventions (key names/enums/thresholds/command sets/parameter tables) follow design doc §17; this file only references them.

    ## Coverage (97 HTTP operations + non-HTTP protocol boundaries)

    - REST message API: §1 auth, §2 users and devices, §3 conversations, §4 messages, §5 uploads, §7 topics, §9.7 media helpers;
    - REST admin API: §8.1–§8.6 (online/nodes/queues/SSE/metrics/users/devices/search/plugins/formats/config/keys/audit);
    - User-facing plugin hub: §12 (`/v1/hub/*`, 14 operations) plus the admin review plane (`/v1/admin/hub/*`, 3 operations);
    - Probes: §6 (`/v1/health`, `/v1/ready`);
    - WebSocket: `GET /v1/ws` (upgrade plus frame protocol registered in the `x-ws` extension, 13 commands total);
    - The MQTT gateway and internal gRPC **are not HTTP interfaces**; they are registered as top-level `x-mqtt-gateway` / `x-grpc-services`
      extensions so the contract inventory stays complete without being disguised as REST operations.

    ## General rules (Doc ⑤ §0)

    - **Authentication**: the message and admin APIs both use `Authorization: Bearer <access_jwt>` (RS256, TTL 900s);
      the admin API enforces RBAC on the JWT claim `role ∈ {admin, ops, user}`; probes require no authentication.
    - **Idempotency**: all write endpoints accept an optional `Idempotency-Key: <ULID>`; a replay with the same key returns the first result
      (the original `200/201/204` status) plus the `Idempotent-Replay: true` response header; the same key with a different request body
      returns `409 CONFLICT`; scope is caller + method + path + key; TTL 24h.
    - **Pagination**: cursor-based `?before_seq=<u64>&limit=<1..200>` (default 50); offset-based
      `?page=<1..>&page_size=<1..200>` (default 1/50); responses are wrapped as
      `{items: [...], next_cursor?, total?}`. Pagination parameters are transmitted as decimal integers.
    - **Error responses** (§0.5): `{code, message, envelope_id?, details?, trace_id}`;
      the HTTP status ↔ code mapping is in §0.6. Clients must tolerate unknown codes (treat them as `INTERNAL` semantics).
    - **Rate-limit response headers** (§0.7): `X-RateLimit-Limit/-Remaining/-Reset`, `X-Quota-Storage-Used/-Limit`,
      and `429/503` responses carry `Retry-After`.
    - **Version negotiation** (§0.8): REST uses the path version `/v1`; breaking changes must run `/v2` in parallel for ≥ 1 release cycle.
  license:
    name: Apache-2.0
  contact:
    name: Lattice
    url: https://github.com/ryten-bench/lattice

servers:
  - url: http://127.0.0.1:8080
    description: Local dev node (docker compose / native; paths already include the `/v1` prefix)
  - url: https://{host}
    description: Production (LB terminates TLS 1.3; path prefix `/v1`)
    variables:
      host:
        default: api.lattice.example.com

security:
  - bearerAuth: []

tags:
  - name: probes
    description: Probes (no authentication) · ⑤ §6
  - name: auth
    description: 'Authentication: login / refresh / logout · ⑤ §1'
  - name: users
    description: Users, devices, and self-service profile · ⑤ §2
  - name: conversations
    description: Conversations and members · ⑤ §3
  - name: messages
    description: Message metadata / downloads / chunk inventory · ⑤ §4
  - name: uploads
    description: Large-object multipart upload (MinIO Multipart) · ⑤ §5
  - name: topics
    description: Topic subscriptions and broadcasts · ⑤ §7
  - name: admin
    description: 'Admin API (RBAC: user read-only / ops remediation / admin changes) · ⑤ §8'
  - name: media
    description: Media helpers (TURN short-lived credentials, recording search) · ⑤ §9.7
  - name: hub
    description: User-facing plugin hub (catalog / publishing / uploads / install records / stats) · ⑤ §12
  - name: ws
    description: WebSocket main-channel upgrade endpoint (frame protocol in x-ws) · ⑤ §9

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |-
        Access JWT (RS256, TTL 900s). Claims include `sub` (user ULID), `dev` (device ID),
        `role` (admin|ops|user), and `exp`. Refresh via `POST /v1/auth/refresh` to obtain a new refresh+access pair;
        role changes take effect within one TTL at most.

  headers:
    XTraceId:
      description: Trace ID (generated or passed through by the gateway; combined with the WS envelope_id, the unified lookup key across the three streams).
      schema:
        type: string
    XRateLimitLimit:
      description: Limit of the current rate-limit window (1s).
      schema:
        type: integer
    XRateLimitRemaining:
      description: Remaining calls in the current rate-limit window.
      schema:
        type: integer
    XRateLimitReset:
      description: Reset time of the current rate-limit window (seconds).
      schema:
        type: integer
    XQuotaStorageUsed:
      description: Used storage quota (bytes).
      schema:
        type: integer
        format: int64
    XQuotaStorageLimit:
      description: Storage quota limit (bytes).
      schema:
        type: integer
        format: int64
    RetryAfter:
      description: Suggested backoff in seconds (429/503).
      schema:
        type: integer
    IdempotentReplay:
      description: '`true` when an idempotency cache hit replays the first response.'
      schema:
        type: string
        enum: ["true"]
    Location:
      description: Presigned download URL (302 redirect target).
      schema:
        type: string
        format: uri
    XContentSha256:
      description: Object content SHA-256 (lowercase hex, 64 characters).
      schema:
        type: string
        pattern: '^[0-9a-f]{64}$'
    XContentLength:
      description: Object size in bytes.
      schema:
        type: integer
        format: int64
    XAccelBuffering:
      description: SSE reverse-proxy hint; must be `no`.
      schema:
        type: string

  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: |-
        Optional idempotency key (ULID, 26-character Crockford Base32). The first request executes and caches the response (TTL 24h);
        a replay with the same key returns the first result plus `Idempotent-Replay: true`; the same key with a different request body returns
        `409 CONFLICT` (`details.reason = idempotency_conflict`). Scope is caller + method +
        path + key, and keys are never reused across users. Omitting this header behaves exactly as before the idempotency middleware existed.
      schema:
        type: string
        pattern: '^[0-9A-HJKMNP-TV-Z]{26}$'
        example: 01J7Q3Z8Y2K4M6N8P0R2T4V6X8
    Page:
      name: page
      in: query
      required: false
      description: Offset-based page number (1-based, default 1).
      schema:
        type: integer
        minimum: 1
        default: 1
    PageSize:
      name: page_size
      in: query
      required: false
      description: Offset-based page size (1..200, default 50; hub catalog defaults to 20 and caps at 100).
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
    Limit:
      name: limit
      in: query
      required: false
      description: Cursor-based page size (1..200, default 50).
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
    BeforeSeq:
      name: before_seq
      in: query
      required: false
      description: 'Cursor: history with seq **strictly less than** this value (half-open interval, boundary excluded).'
      schema:
        type: integer
        format: int64
    AfterSeq:
      name: after_seq
      in: query
      required: false
      description: 'Cursor: history with seq **strictly greater than** this value (offline redelivery reconciliation / resumable reads).'
      schema:
        type: integer
        format: int64
    TraceId:
      name: X-Trace-Id
      in: header
      required: false
      description: Caller-supplied trace ID (generated by the gateway when omitted).
      schema:
        type: string

  responses:
    BadRequest:
      description: '400 `PROTOCOL`: malformed request structure / missing required field / JSON parse failure.'
      headers:
        X-Trace-Id: { $ref: '#/components/headers/XTraceId' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Unauthorized:
      description: '401 `AUTH_FAIL`: missing / expired / badly signed token, or device fingerprint mismatch (re-login required).'
      headers:
        X-Trace-Id: { $ref: '#/components/headers/XTraceId' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Forbidden:
      description: '403 `FORBIDDEN`: RBAC violation, or a non-member accessing conversation messages (`details.reason = not_member`).'
      headers:
        X-Trace-Id: { $ref: '#/components/headers/XTraceId' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NotFound:
      description: '404 `NOT_FOUND`: resource does not exist (user / message / conversation / upload / recording segment / plugin).'
      headers:
        X-Trace-Id: { $ref: '#/components/headers/XTraceId' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Conflict:
      description: |-
        409 `CONFLICT`: idempotency key conflict (`details.reason = idempotency_conflict` / `idempotency_in_progress`),
        refresh token already rotated, subscription conflict, version already published (`version_published`), plugin data version conflict (`data_conflict`), and so on.
      headers:
        X-Trace-Id: { $ref: '#/components/headers/XTraceId' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    TooLarge:
      description: |-
        413 `TOO_LARGE`: request body too large (`/messages` > 1MB, admin JSON > 4MB, plugin package > 20MiB,
        source package > 50MiB). `details.hint = use_ws_or_chunk` (message API) or `details.reason` + `details.max_bytes`.
      headers:
        X-Trace-Id: { $ref: '#/components/headers/XTraceId' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Format:
      description: |-
        422 `FORMAT`: semantic validation failed (invalid `kind`, out-of-range `limit`, `sha256` mismatch, invalid query parameter,
        audit query too broad `too_broad`, and so on).
      headers:
        X-Trace-Id: { $ref: '#/components/headers/XTraceId' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    RateLimited:
      description: '429 `RATE`: rate limit or quota exceeded; carries `Retry-After` (seconds) and `X-RateLimit-*` headers.'
      headers:
        Retry-After: { $ref: '#/components/headers/RetryAfter' }
        X-RateLimit-Limit: { $ref: '#/components/headers/XRateLimitLimit' }
        X-RateLimit-Remaining: { $ref: '#/components/headers/XRateLimitRemaining' }
        X-RateLimit-Reset: { $ref: '#/components/headers/XRateLimitReset' }
        X-Trace-Id: { $ref: '#/components/headers/XTraceId' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Internal:
      description: '500 `INTERNAL`: unexpected error (`trace_id` always included).'
      headers:
        X-Trace-Id: { $ref: '#/components/headers/XTraceId' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    ServiceUnavailable:
      description: |-
        503 `INTERNAL`: dependency unavailable / node not ready / draining. `details.dep ∈ {pg, redis, bus}`,
        and health probes additionally carry `ready`/`draining`/`deps`/`node_id`/`version`.
      headers:
        Retry-After: { $ref: '#/components/headers/RetryAfter' }
        X-Trace-Id: { $ref: '#/components/headers/XTraceId' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }

  schemas:
    # ------------------------------------------------------------------ Common
    Error:
      type: object
      required: [code, message]
      description: Unified error response (Doc ⑤ §0.5).
      properties:
        code: { $ref: '#/components/schemas/ErrorCode' }
        message:
          type: string
          description: Short human-readable English message (safe to localize for display).
        envelope_id:
          type: string
          description: Present when a specific message is involved (chunk IDs look like `<id>.c<i>`).
        details:
          type: object
          additionalProperties: true
          description: Structured details (`reason`/`field`/`dep`/`hint`/`max_bytes`, and so on).
        trace_id:
          type: string
          description: Trace ID (matches the X-Trace-Id response header).
    ErrorCode:
      type: string
      description: |-
        Unified code namespace. `FORBIDDEN`/`CONFLICT`/`TOO_LARGE` are REST-side extension codes and never appear in WS frames;
        clients must tolerate unknown values (treat them as `INTERNAL` semantics).
      enum: [AUTH_FAIL, FORBIDDEN, NOT_FOUND, CONFLICT, PROTOCOL, TOO_LARGE, FORMAT, RATE, QUOTA, PLUGIN, INTERNAL]
    Ulid:
      type: string
      pattern: '^[0-9A-HJKMNP-TV-Z]{26}$'
      description: ULID (26-character uppercase Crockford Base32).
    Timestamp:
      type: string
      format: date-time
      description: RFC 3339 UTC with millisecond precision (`2025-07-01T08:30:00.000Z`).
    NullableString:
      type: [string, 'null']
      description: Nullable string (field-specific default semantics are defined in each field description).
    PageEnvelope:
      type: object
      description: Offset-based pagination response wrapper.
      required: [items]
      properties:
        items:
          type: array
          items: {}
        total:
          type: integer
          format: int64
          description: Total item count (admin API lists).
    OkOk:
      type: object
      description: Simple success response.
      properties:
        ok: { type: boolean }
    TaskAccepted:
      type: object
      description: Async task accepted (202).
      required: [task_id]
      properties:
        task_id: { $ref: '#/components/schemas/Ulid' }
        accepted: { type: boolean }
        state:
          type: string
          description: 'Task state (for example `running`).'

    # ------------------------------------------------------------------ Auth / users
    Capabilities:
      type: object
      description: Device / user capability declarations (authoritative values come from WS `hello.caps`; these are declarations, not guarantees).
      properties:
        formats: { type: array, items: { type: string }, example: [text, json, proto] }
        compression: { type: array, items: { type: string }, example: [zstd, lz4] }
        e2e: { type: boolean }
        quic: { type: boolean }
        webrtc: { type: boolean }
    Quota:
      type: object
      description: User quota (design §17.13).
      properties:
        msg_per_s: { type: integer, example: 100 }
        bytes_per_s: { type: integer, format: int64, example: 26214400 }
        topics: { type: integer, example: 100 }
        storage_bytes: { type: integer, format: int64, example: 10737418240 }
    DeviceInfo:
      type: object
      required: [id, fingerprint]
      properties:
        id: { $ref: '#/components/schemas/Ulid' }
        fingerprint:
          type: string
          description: 'Authoritative device fingerprint (`sha256:...`); the client reports it verbatim in WS `hello.device_fp`.'
        device_name: { type: string }
        revoked_at: { $ref: '#/components/schemas/Timestamp' }
        last_seen: { $ref: '#/components/schemas/Timestamp' }
        created_at: { $ref: '#/components/schemas/Timestamp' }
    UserPublic:
      type: object
      required: [id, username]
      properties:
        id: { $ref: '#/components/schemas/Ulid' }
        username: { type: string }
        display_name: { $ref: '#/components/schemas/NullableString' }
        avatar: { $ref: '#/components/schemas/NullableString' }
        status:
          type: string
          enum: [active, suspended, deleted]
        role:
          type: string
          enum: [admin, ops, user]
          description: 'Authoritative values come from `users.role`; the legacy `viewer` value degrades to `user` on read paths.'
        capabilities: { $ref: '#/components/schemas/Capabilities' }
        quota: { $ref: '#/components/schemas/Quota' }
        created_at: { $ref: '#/components/schemas/Timestamp' }
        updated_at: { $ref: '#/components/schemas/Timestamp' }
    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username: { type: string }
        password: { type: string, format: password }
        device_name:
          type: string
          description: Device display name (for example `Alienware-m16`).
        device_fp:
          type: string
          description: |-
            Device fingerprint (`sha256:...`), optional; when omitted, the server generates `<sha256>:<ulid>` and returns it in the response
            `device.fingerprint`; the client must report it verbatim in the WS `hello`.
    AuthResponse:
      type: object
      required: [access_jwt, refresh_token, expires_in, device, user]
      description: Login / refresh success response.
      properties:
        access_jwt:
          type: string
          description: RS256 JWT, TTL 900s.
        refresh_token:
          type: string
          description: '`b64:...` random 256-bit value; the server stores only `devices.token_hash`.'
        expires_in: { type: integer, example: 900 }
        device: { $ref: '#/components/schemas/DeviceInfo' }
        user:
          type: object
          required: [id, username]
          properties:
            id: { $ref: '#/components/schemas/Ulid' }
            username: { type: string }
            display_name: { $ref: '#/components/schemas/NullableString' }
            capabilities: { $ref: '#/components/schemas/Capabilities' }
    RefreshRequest:
      type: object
      required: [refresh_token]
      properties:
        refresh_token:
          type: string
          description: "May also be passed via `Authorization: Bearer <refresh_token>`."
    UserPatchRequest:
      type: object
      description: |-
        Partial update. Self: only `display_name`/`avatar` (`avatar` accepts an https URL or
        `data:image/(png|jpeg|webp|gif);base64`, ≤256KiB; an empty string clears it). Admins changing another user's profile use
        `PATCH /v1/admin/users/{id}`. Omitted fields stay unchanged.
      properties:
        display_name: { type: string, maxLength: 128 }
        avatar: { $ref: '#/components/schemas/NullableString' }
    PasswordChangeRequest:
      type: object
      required: [old_password, new_password]
      properties:
        old_password: { type: string, format: password }
        new_password: { type: string, format: password, minLength: 8 }
    MeResponse:
      type: object
      description: '`GET /v1/me`: current identity + online devices + queue depth (client startup snapshot).'
      properties:
        user_id: { $ref: '#/components/schemas/Ulid' }
        username: { type: string }
        display_name: { $ref: '#/components/schemas/NullableString' }
        role: { type: string, enum: [admin, ops, user] }
        device_id: { $ref: '#/components/schemas/Ulid' }
        node_id: { $ref: '#/components/schemas/Ulid' }
        online_devices:
          type: object
          additionalProperties: { type: string }
          description: '`{device_id: node_id}` online device mapping.'
        pending:
          type: object
          properties:
            depth: { type: integer, format: int64 }
            oldest_seq: { type: integer, format: int64 }
        server_ts: { $ref: '#/components/schemas/Timestamp' }

    # ------------------------------------------------------------------ Conversations
    ConversationCreateRequest:
      type: object
      required: [kind]
      properties:
        kind:
          type: string
          enum: [dm, group, topic]
          description: 'With `dm`, `member_ids` must contain exactly one user; re-creating the same dm returns the existing conversation (idempotent 200).'
        name: { type: string, maxLength: 128 }
        member_ids:
          type: array
          maxItems: 100
          items: { $ref: '#/components/schemas/Ulid' }
    ConversationMember:
      type: object
      required: [user_id, role]
      properties:
        user_id: { $ref: '#/components/schemas/Ulid' }
        role: { type: string, enum: [owner, admin, member] }
        joined_at: { $ref: '#/components/schemas/Timestamp' }
    Conversation:
      type: object
      required: [id, kind]
      properties:
        id: { $ref: '#/components/schemas/Ulid' }
        kind: { type: string, enum: [dm, group, topic] }
        name: { $ref: '#/components/schemas/NullableString' }
        owner_id: { $ref: '#/components/schemas/Ulid' }
        last_seq: { type: integer, format: int64 }
        last_msg_at: { $ref: '#/components/schemas/Timestamp' }
        unread:
          type: integer
          description: Derived from `read_watermark` and `last_seq`.
        members: { type: integer, description: Member count. }
        created_at: { $ref: '#/components/schemas/Timestamp' }
        updated_at: { $ref: '#/components/schemas/Timestamp' }
    ConversationDetail:
      type: object
      description: '`GET /v1/conversations/{id}`: details + member list.'
      properties:
        conversation: { $ref: '#/components/schemas/Conversation' }
        id: { $ref: '#/components/schemas/Ulid' }
        kind: { type: string, enum: [dm, group, topic] }
        name: { $ref: '#/components/schemas/NullableString' }
        members:
          type: array
          items: { $ref: '#/components/schemas/ConversationMember' }
        member_ids:
          type: array
          items: { $ref: '#/components/schemas/Ulid' }
    ConversationPatchRequest:
      type: object
      description: Rename (owner/admin member role; `topic` conversations use the topic channel and produce no messages rows).
      properties:
        name: { type: string, maxLength: 128 }
    ConversationReadRequest:
      type: object
      required: [seq]
      description: 'Report the read watermark (idempotent: monotonic max, regressions ignored).'
      properties:
        seq: { type: integer, format: int64 }
    ConversationMembersRequest:
      type: object
      required: [user_ids]
      properties:
        user_ids:
          type: array
          minItems: 1
          maxItems: 100
          items: { $ref: '#/components/schemas/Ulid' }
    ConversationList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Conversation' }
    ConversationHistory:
      type: object
      required: [items]
      description: Conversation message history (by `seq desc`; `next_cursor.before_seq` is the next-page cursor).
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/MessageMeta' }
        next_cursor:
          type: object
          properties:
            before_seq: { type: integer, format: int64 }

    # ------------------------------------------------------------------ Messages
    MessageCreateRequest:
      type: object
      required: [conv_id]
      description: Equivalent to a WS `envelope` frame; the server injects `sender` (any client value is ignored). Request body ≤ 1MB.
      properties:
        id:
          type: string
          description: Generated by the server (ULID) when omitted; if the body `id` conflicts with `Idempotency-Key`, `id` wins.
        type:
          type: string
          example: json
          description: The type namespace from design §5.
        conv_id: { $ref: '#/components/schemas/Ulid' }
        to_user: { $ref: '#/components/schemas/Ulid' }
        to_topic: { type: string }
        to_devices:
          type: array
          items: { type: string }
          description: Targeted delivery (design §17.4-5).
        encoding: { type: string, enum: [utf8, raw], default: utf8 }
        ttl_seconds:
          type: integer
          description: 0 = never expires (affects the dedup retention period, design §17.5).
        checksum_sha256: { type: string }
        content_type: { type: string }
        payload:
          type: string
          description: '`b64:...` inline payload (≤1MB); large objects go through `/v1/uploads`.'
    RecipientState:
      type: object
      properties:
        user: { $ref: '#/components/schemas/Ulid' }
        device: { type: string }
        state:
          type: string
          enum: [persisted, routed, delivered, acked, dropped, expired, dlq]
    MessageCreated:
      type: object
      description: Message acceptance result (201). `seq` is assigned by the server (design §17.2).
      required: [id, seq, state]
      properties:
        id: { $ref: '#/components/schemas/Ulid' }
        conv_id: { $ref: '#/components/schemas/Ulid' }
        seq: { type: integer, format: int64 }
        state:
          type: string
          enum: [persisted, routed]
        recipients:
          type: array
          items: { $ref: '#/components/schemas/RecipientState' }
        payload_ref:
          type: string
          description: MinIO object key for large-object messages (may be returned by `/v1/uploads/{id}/complete`).
    DeliveryDevice:
      type: object
      properties:
        device: { type: string }
        state:
          type: string
          enum: [persisted, routed, delivered, acked, dropped, expired, dlq]
        attempts: { type: integer }
        last_at: { $ref: '#/components/schemas/Timestamp' }
        acked_at: { $ref: '#/components/schemas/Timestamp' }
    DeliverySummary:
      type: object
      description: '`delivery_log` summary aggregated per device.'
      properties:
        to_user: { $ref: '#/components/schemas/Ulid' }
        devices:
          type: array
          items: { $ref: '#/components/schemas/DeliveryDevice' }
    MessageMeta:
      type: object
      description: Message metadata (GET /v1/messages/{id}; session history uses the same shape).
      required: [id, seq]
      properties:
        id: { $ref: '#/components/schemas/Ulid' }
        conv_id: { $ref: '#/components/schemas/Ulid' }
        sender: { $ref: '#/components/schemas/Ulid' }
        env_type: { type: string }
        content_type: { type: string }
        size: { type: integer, format: int64 }
        chunk_total: { type: integer }
        seq: { type: integer, format: int64 }
        status:
          type: string
          enum: [persisted, routed, delivered, acked, dropped, expired, dlq]
        created_at: { $ref: '#/components/schemas/Timestamp' }
        expires_at: { $ref: '#/components/schemas/Timestamp' }
        payload_ref: { $ref: '#/components/schemas/NullableString' }
        has_inline_payload: { type: boolean }
        delivery_summary: { $ref: '#/components/schemas/DeliverySummary' }
    ChunkInfo:
      type: object
      properties:
        idx: { type: integer }
        size: { type: integer, format: int64 }
        checksum: { type: string, description: Per-chunk xxhash64. }
        presigned_url:
          allOf: [{ $ref: '#/components/schemas/NullableString' }]
          description: >-
            Chunk download URL. With `[transfer] enabled` this is a transfer-plane capability URL
            (`{transfer.public_base_url}/t/{token}`, or a same-origin `/t/{token}` when
            `public_base_url` is empty); otherwise a legacy MinIO presigned URL.
    ChunksResponse:
      type: object
      required: [items]
      properties:
        msg_id: { $ref: '#/components/schemas/Ulid' }
        items:
          type: array
          items: { $ref: '#/components/schemas/ChunkInfo' }

    # ------------------------------------------------------------------ Uploads
    UploadCreateRequest:
      type: object
      required: [size, sha256, name]
      properties:
        size: { type: integer, format: int64 }
        sha256:
          type: string
          description: '`b64:...` or lowercase hex; the overall value is verified on complete.'
        name: { type: string, maxLength: 256 }
        conv_id: { $ref: '#/components/schemas/Ulid' }
        part_size:
          type: integer
          description: Fixed at 8MB (8388608, design §17.6); any other value → 422 FORMAT.
          example: 8388608
    UploadPartUrl:
      type: object
      properties:
        part: { type: integer, minimum: 1 }
        url: { type: string, format: uri }
        expires_at: { $ref: '#/components/schemas/Timestamp' }
    UploadCreated:
      type: object
      description: Upload session created (201). Presigned URLs have a 900s TTL; unfinished parts can be reissued via `POST /v1/uploads/{id}/parts`.
      required: [upload_id, part_size, part_count]
      properties:
        upload_id: { $ref: '#/components/schemas/Ulid' }
        part_size: { type: integer }
        part_count: { type: integer }
        part_urls:
          type: array
          items: { $ref: '#/components/schemas/UploadPartUrl' }
        expires_at: { $ref: '#/components/schemas/Timestamp' }
    UploadProgress:
      type: object
      properties:
        upload_id: { $ref: '#/components/schemas/Ulid' }
        size: { type: integer, format: int64 }
        part_size: { type: integer }
        part_count: { type: integer }
        completed_parts:
          type: array
          items: { type: integer }
        expires_at: { $ref: '#/components/schemas/Timestamp' }
    UploadCompletedPart:
      type: object
      required: [part, etag]
      properties:
        part: { type: integer, minimum: 1 }
        etag: { type: string }
    UploadCompleteRequest:
      type: object
      required: [parts]
      properties:
        parts:
          type: array
          items: { $ref: '#/components/schemas/UploadCompletedPart' }
    UploadCompleted:
      description: Creates a `file` type Envelope and delivers it through the normal path (201).
      allOf:
        - $ref: '#/components/schemas/MessageCreated'
        - type: object
          properties:
            payload_ref: { type: string }

    # ------------------------------------------------------------------ Topics / probes
    TopicSubscription:
      type: object
      properties:
        topic: { type: string }
        subscribed_at: { $ref: '#/components/schemas/Timestamp' }
        subscribers: { type: integer, description: Current subscriber count. }
    TopicUnsubscribeResponse:
      type: object
      properties:
        topic: { type: string }
        subscribed: { type: boolean, enum: [false] }
    TopicList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            type: object
            properties:
              topic: { type: string }
              last_offset: { type: integer, format: int64 }
              unread: { type: integer }
    TopicHistory:
      type: object
      required: [topic, items]
      properties:
        topic: { type: string }
        items:
          type: array
          items: { $ref: '#/components/schemas/MessageMeta' }
    TopicPublishRequest:
      type: object
      description: Operational broadcast (role ∈ {admin, ops} only; applications should prefer WS `envelope{to_topic}`).
      required: [payload]
      properties:
        type: { type: string, example: json }
        payload: { type: string, description: '`b64:...` inline payload.' }
        content_type: { type: string }
    HealthResponse:
      type: object
      required: [status]
      properties:
        status: { type: string, enum: [ok] }
    ReadyResponse:
      type: object
      required: [ready, deps]
      properties:
        ready: { type: boolean }
        deps:
          type: object
          description: Dependency state; `degraded` does not return 503 — only total dependency unavailability does.
          properties:
            pg: { type: string, enum: [ok, degraded, down] }
            redis: { type: string, enum: [ok, degraded, down] }
            bus: { type: string, enum: [ok, degraded, down] }
        draining: { type: boolean }
        node_id: { $ref: '#/components/schemas/Ulid' }
        version: { type: string, example: 0.1.0 }

    # ------------------------------------------------------------------ Media
    TurnCredentials:
      type: object
      description: |-
        Short-lived coturn REST API credentials; `enabled=false` (TURN not configured) is not an error — the client falls back to a direct connection/tunnel.
      required: [enabled]
      properties:
        enabled: { type: boolean }
        uris:
          type: array
          items: { type: string }
          example: ['turn:turn.example.com:3478?transport=udp']
        username:
          type: string
          description: '`<expiry_unix>:<user_id>` (the authoritative expiry checked by coturn).'
        credential: { type: string, description: base64(HMAC-SHA1(secret, username)) }
        ttl: { type: integer, description: Seconds (max 600). }
        expires_at: { $ref: '#/components/schemas/Timestamp' }
    Recording:
      type: object
      description: Recording segment metadata (no payload/URL).
      required: [id]
      properties:
        id: { $ref: '#/components/schemas/Ulid' }
        stream_id: { type: string }
        node_id: { type: string }
        object_key: { type: string }
        manifest_key: { $ref: '#/components/schemas/NullableString' }
        bucket: { type: string }
        first_seq: { type: integer, format: int64 }
        last_seq: { type: integer, format: int64 }
        frames: { type: integer }
        size_bytes: { type: integer, format: int64 }
        codec: { $ref: '#/components/schemas/NullableString' }
        format: { type: string }
        created_at: { $ref: '#/components/schemas/Timestamp' }
        started_at: { $ref: '#/components/schemas/Timestamp' }
        ended_at: { $ref: '#/components/schemas/Timestamp' }
    RecordingDetail:
      description: Recording segment metadata + presigned URL (TTL 300s).
      allOf:
        - $ref: '#/components/schemas/Recording'
        - type: object
          properties:
            presigned_url:
              type: string
              format: uri
              description: >-
                Recording download URL: transfer-plane capability when `[transfer] enabled`,
                otherwise a legacy MinIO presigned URL.
            download_url: { type: string }
            manifest_url: { $ref: '#/components/schemas/NullableString' }
    RecordingList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Recording' }
        limit: { type: integer }
        next_before: { $ref: '#/components/schemas/NullableString' }
    RecordingManifest:
      type: object
      description: |-
        Recording segment frame-index manifest (`format=raw-frames`, `playable=false`): returns only the frame-index JSON,
        does not return object bytes, and is not directly playable.
      properties:
        recording_id: { $ref: '#/components/schemas/Ulid' }
        format: { type: string, enum: [raw-frames] }
        playable: { type: boolean, enum: [false] }
        frames:
          type: array
          items:
            type: object
            additionalProperties: true

    # ------------------------------------------------------------------ Admin API: request bodies
    AdminUserCreateRequest:
      type: object
      required: [username, password]
      properties:
        username: { type: string, pattern: '^[A-Za-z0-9_.-]{3,64}$' }
        password: { type: string, format: password, minLength: 8 }
        display_name: { type: string, maxLength: 128 }
        role:
          type: string
          enum: [admin, ops, user]
          default: user
          description: Defaults to `user` (the legacy `viewer` only degrades to `user` on read paths; writes reject it).
    AdminUserPatchRequest:
      type: object
      required: [reason]
      description: Update a user profile (display_name/avatar); audit `user.update` (the raw avatar is not recorded).
      properties:
        display_name: { type: string, maxLength: 128 }
        avatar: { $ref: '#/components/schemas/NullableString' }
        reason: { type: string, minLength: 1, maxLength: 500 }
    AdminUserPasswordRequest:
      type: object
      required: [new_password, reason]
      description: |-
        Reset a password (admin only): argon2id rehash + revoke all devices of the user / disconnect WS;
        returns `{ok, sessions_revoked}` and never echoes the password.
      properties:
        new_password: { type: string, format: password, minLength: 8 }
        reason: { type: string, minLength: 1 }
    AdminQuotaRequest:
      type: object
      properties:
        msg_per_s: { type: integer, minimum: 1 }
        bytes_per_s: { type: integer, format: int64, minimum: 1 }
        topics: { type: integer, minimum: 1 }
        storage_bytes: { type: integer, format: int64, minimum: 1 }
        reason: { type: string }
    AdminRoleChangeRequest:
      type: object
      required: [role, reason]
      description: Change an admin-API role (admin only); writes audit `role.change`; takes effect within one TTL (900s) at most.
      properties:
        role: { type: string, enum: [admin, ops, user] }
        reason: { type: string, minLength: 1 }
    AdminReasonRequest:
      type: object
      description: Minimal request body for admin operations (suspend/resume/revoke, and so on).
      required: [reason]
      properties:
        reason: { type: string, minLength: 1, maxLength: 500 }
    AdminPurgeRequest:
      type: object
      required: [reason, confirm_username]
      description: Compliance cascade delete; `confirm_username` must match the target username, otherwise 422.
      properties:
        reason: { type: string, minLength: 1 }
        confirm_username: { type: string }
    AdminDrainRequest:
      type: object
      required: [reason]
      properties:
        reason: { type: string, minLength: 1 }
        wait_seconds:
          type: integer
          minimum: 1
          maximum: 30
          default: 30
    AdminQueuePurgeRequest:
      type: object
      required: [user, scope, reason]
      properties:
        user: { $ref: '#/components/schemas/Ulid' }
        scope: { type: string, enum: [user, device, topic] }
        before_ts:
          type: string
          format: date-time
          description: Omitted = purge all pending deliveries in the scope (pure ZREM, no lookup).
        reason: { type: string, minLength: 1 }
    AdminReplayRequest:
      type: object
      required: [msg_ids, reason]
      properties:
        msg_ids:
          type: array
          minItems: 1
          maxItems: 1000
          items: { $ref: '#/components/schemas/Ulid' }
        reason: { type: string, minLength: 1 }
    AdminPluginActionRequest:
      type: object
      required: [ns, version, action, reason]
      properties:
        ns: { type: string }
        version: { type: string }
        action: { type: string, enum: [publish, rollback, canary] }
        ratio:
          type: number
          minimum: 0
          maximum: 1
          description: 'Canary ratio when `action=canary`.'
        reason: { type: string, minLength: 1 }
    AdminWasmReloadRequest:
      type: object
      properties:
        source:
          type: string
          enum: [all, dir, pg]
          default: all
    AdminFormatUpsertRequest:
      type: object
      required: [name, reason]
      properties:
        name: { type: string }
        mime: { type: string }
        detect_rules:
          type: array
          items:
            type: object
            additionalProperties: true
        parser: { type: string }
        signed: { type: boolean }
        reason: { type: string, minLength: 1 }
    AdminConfigPatchRequest:
      type: object
      required: [reason]
      properties:
        ratelimit:
          type: object
          additionalProperties: true
        plugins_enabled: { type: boolean }
        canary:
          type: object
          additionalProperties: true
        reason: { type: string, minLength: 1 }
    AdminKeyRotateRequest:
      type: object
      required: [target, reason]
      description: |-
        Key rotation (dual-key overlap window `[auth] key_overlap_hours`, 24h by default). `target=jwt` really generates
        2048-bit RSA, writes to disk atomically, and hot-swaps; `kek`/`internal_ca` are currently `implemented=false`.
      properties:
        target: { type: string, enum: [jwt, kek, internal_ca] }
        reason: { type: string, minLength: 1 }

    # ------------------------------------------------------------------ Admin API: response bodies
    AdminUser:
      description: Admin-API user view (includes quota and online device count; excludes password_hash).
      allOf:
        - $ref: '#/components/schemas/UserPublic'
        - type: object
          properties:
            devices: { type: integer }
            online_devices: { type: integer }
    AdminUserPage:
      description: User search (offset-based pagination, §8.2).
      allOf:
        - $ref: '#/components/schemas/PageEnvelope'
        - type: object
          properties:
            items:
              type: array
              items: { $ref: '#/components/schemas/AdminUser' }
    AdminDevice:
      type: object
      properties:
        id: { $ref: '#/components/schemas/Ulid' }
        user_id: { $ref: '#/components/schemas/Ulid' }
        name: { $ref: '#/components/schemas/NullableString' }
        platform: { $ref: '#/components/schemas/NullableString' }
        fingerprint: { type: string }
        last_seen: { $ref: '#/components/schemas/Timestamp' }
        revoked_at: { $ref: '#/components/schemas/Timestamp' }
        created_at: { $ref: '#/components/schemas/Timestamp' }
    AdminDevicePage:
      allOf:
        - $ref: '#/components/schemas/PageEnvelope'
        - type: object
          properties:
            items:
              type: array
              items: { $ref: '#/components/schemas/AdminDevice' }
    AdminUserPasswordResponse:
      type: object
      properties:
        ok: { type: boolean }
        sessions_revoked: { type: integer }
    AdminPurgeProgress:
      type: object
      description: Compliance deletion task progress (per-store counts for PG/MinIO/Redis).
      properties:
        task_id: { $ref: '#/components/schemas/Ulid' }
        state: { type: string, enum: [running, done, failed] }
        user_id: { $ref: '#/components/schemas/Ulid' }
        pg_deleted: { type: integer, format: int64 }
        minio_deleted: { type: integer, format: int64 }
        redis_deleted: { type: integer, format: int64 }
        started_at: { $ref: '#/components/schemas/Timestamp' }
        finished_at: { $ref: '#/components/schemas/Timestamp' }
    AdminDrainStatus:
      type: object
      description: Drain progress (including the byef count sent).
      properties:
        draining: { type: boolean }
        node_id: { type: string }
        remaining_connections: { type: integer }
        byef_sent: { type: integer }
        wait_seconds: { type: integer }
        started_at: { $ref: '#/components/schemas/Timestamp' }
    AdminQueuePurgeResponse:
      type: object
      properties:
        removed: { type: integer, format: int64 }
        scanned: { type: integer, format: int64 }
    AdminReplayResponse:
      type: object
      properties:
        accepted:
          type: array
          items: { $ref: '#/components/schemas/Ulid' }
        rejected:
          type: array
          items:
            type: object
            properties:
              id: { $ref: '#/components/schemas/Ulid' }
              reason: { type: string }
    AdminNode:
      type: object
      properties:
        node_id: { type: string }
        version: { type: string }
        connections: { type: integer }
        health: { type: string, enum: [ok, degraded, down] }
        heartbeat_at: { $ref: '#/components/schemas/Timestamp' }
        local: { type: boolean }
    AdminNodeList:
      type: object
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/AdminNode' }
        total: { type: integer }
    AdminOnlineDevice:
      type: object
      properties:
        device: { type: string }
        node: { type: string }
        protocol: { type: string, example: ws }
        connected_at: { $ref: '#/components/schemas/Timestamp' }
        duration_s: { type: integer }
        remote_ip: { type: string }
        caps: { $ref: '#/components/schemas/Capabilities' }
    AdminOnlineResponse:
      type: object
      properties:
        user: { $ref: '#/components/schemas/Ulid' }
        devices:
          type: array
          items: { $ref: '#/components/schemas/AdminOnlineDevice' }
    AdminOnlineStats:
      type: object
      description: 'Aggregated online statistics; same figures as the SSE `online` event (computing them separately is forbidden).'
      properties:
        online_users: { type: integer }
        online_devices: { type: integer }
        by_protocol:
          type: object
          additionalProperties: { type: integer }
        by_node:
          type: object
          additionalProperties: { type: integer }
        node_id: { type: string }
        uptime_s: { type: integer, format: int64 }
        updated_at: { $ref: '#/components/schemas/Timestamp' }
    AdminQueueInfo:
      type: object
      properties:
        user: { $ref: '#/components/schemas/Ulid' }
        scope: { type: string, enum: [user, device, topic] }
        depth: { type: integer, format: int64 }
        oldest_seq: { type: integer, format: int64 }
        oldest_ts: { $ref: '#/components/schemas/Timestamp' }
    AdminConversation:
      type: object
      properties:
        id: { $ref: '#/components/schemas/Ulid' }
        kind: { type: string, enum: [dm, group, topic] }
        name: { $ref: '#/components/schemas/NullableString' }
        owner_id: { $ref: '#/components/schemas/Ulid' }
        members: { type: integer }
        messages: { type: integer, format: int64 }
        last_msg_at: { $ref: '#/components/schemas/Timestamp' }
        created_at: { $ref: '#/components/schemas/Timestamp' }
        updated_at: { $ref: '#/components/schemas/Timestamp' }
    AdminConversationPage:
      allOf:
        - $ref: '#/components/schemas/PageEnvelope'
        - type: object
          properties:
            items:
              type: array
              items: { $ref: '#/components/schemas/AdminConversation' }
    AdminMessagePage:
      allOf:
        - $ref: '#/components/schemas/PageEnvelope'
        - type: object
          properties:
            items:
              type: array
              items: { $ref: '#/components/schemas/MessageMeta' }
    AdminDeliveryDetail:
      type: object
      description: Delivery detail (`delivery_log` all-device view).
      properties:
        message_id: { $ref: '#/components/schemas/Ulid' }
        items:
          type: array
          items:
            type: object
            properties:
              user: { $ref: '#/components/schemas/Ulid' }
              device: { type: string }
              state: { type: string }
              attempts: { type: integer }
              last_at: { $ref: '#/components/schemas/Timestamp' }
              acked_at: { $ref: '#/components/schemas/Timestamp' }
    AdminDlqPage:
      allOf:
        - $ref: '#/components/schemas/PageEnvelope'
        - type: object
          properties:
            items:
              type: array
              items:
                type: object
                additionalProperties: true
    AdminPluginInfo:
      type: object
      properties:
        ns: { type: string }
        version: { type: string }
        status: { type: string, enum: [published, canary, rolled_back, disabled] }
        canary_ratio: { type: number }
        invocations: { type: integer, format: int64 }
        failures: { type: integer, format: int64 }
        avg_latency_ms: { type: number }
    AdminPluginList:
      type: object
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/AdminPluginInfo' }
        wasm:
          type: object
          description: 'WASM host state (added in v0.18; the original items fields are unchanged).'
          additionalProperties: true
    AdminPluginStats:
      type: object
      properties:
        ns: { type: string }
        window: { type: string, example: 1h }
        invocations: { type: integer, format: int64 }
        failures: { type: integer, format: int64 }
        failure_rate: { type: number }
        latency_ms:
          type: object
          properties:
            p50: { type: number }
            p95: { type: number }
            p99: { type: number }
        memory_peak_bytes: { type: integer, format: int64 }
    AdminWasmReloadResponse:
      type: object
      description: WASM plugin hot-reload result (atomic rebuild + one swap; the old snapshot is kept on failure).
      properties:
        loaded: { type: integer }
        from_dir: { type: integer }
        from_pg: { type: integer }
        rejected: { type: integer }
        conflicts: { type: integer }
        generation: { type: integer, format: int64 }
        elapsed_ms: { type: integer, format: int64 }
    AdminWasmInvokeRequest:
      type: object
      required: [input_b64]
      properties:
        input_b64: { type: string, description: Base64-encoded input. }
        entry: { type: string }
    AdminWasmInvokeResponse:
      type: object
      properties:
        output_b64: { type: string }
        output_bytes: { type: integer, format: int64 }
        elapsed_ms: { type: integer, format: int64 }
        plugin: { type: string }
        version: { type: string }
        entry: { type: string }
        fuel_used: { type: integer, format: int64 }
    AdminFormatList:
      type: object
      properties:
        items:
          type: array
          items:
            type: object
            additionalProperties: true
    AdminConfigSnapshot:
      type: object
      description: Dynamic config snapshot (read-only with source markers).
      properties:
        items:
          type: array
          items:
            type: object
            properties:
              key: { type: string }
              value: {}
              source: { type: string, enum: [pg, toml, env] }
        config:
          type: object
          additionalProperties: true
    AdminKeyRotateResponse:
      type: object
      description: |-
        `target=jwt` returns a real rotation result; `kek`/`internal_ca` are currently `implemented=false,
        status=not_implemented`. A read-only key directory → 500 INTERNAL + `details.reason=key_dir_readonly`.
      properties:
        implemented: { type: boolean }
        status: { type: string, enum: [rotated, not_implemented] }
        algorithm: { type: string, enum: [RS256] }
        key_bits: { type: integer }
        rotated_at: { $ref: '#/components/schemas/Timestamp' }
        previous_until: { $ref: '#/components/schemas/Timestamp' }
        overlap_hours: { type: integer }
        current_fingerprint: { type: string }
        previous_fingerprint: { $ref: '#/components/schemas/NullableString' }
    AdminKeyInfo:
      type: object
      properties:
        fingerprint: { type: string }
        role: { type: string, enum: [current, previous] }
        rotated_at: { $ref: '#/components/schemas/Timestamp' }
        until: { $ref: '#/components/schemas/Timestamp' }
        active: { type: boolean }
    AdminKeysResponse:
      type: object
      description: Key fingerprints and validity windows (**private keys are not returned**).
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/AdminKeyInfo' }
        overlap_hours: { type: integer }
        rotated_at: { $ref: '#/components/schemas/Timestamp' }
        previous_until: { $ref: '#/components/schemas/Timestamp' }
        current: { type: string }
        previous: { $ref: '#/components/schemas/NullableString' }
    AdminAuditItem:
      type: object
      properties:
        id: { $ref: '#/components/schemas/Ulid' }
        actor: { type: string }
        action: { type: string }
        target: { type: string }
        detail: {}
        ip: { type: string }
        created_at: { $ref: '#/components/schemas/Timestamp' }
    AdminAuditPage:
      allOf:
        - $ref: '#/components/schemas/PageEnvelope'
        - type: object
          properties:
            items:
              type: array
              items: { $ref: '#/components/schemas/AdminAuditItem' }

    # ------------------------------------------------------------------ Plugin hub (user-facing)
    HubOwner:
      type: object
      properties:
        id: { $ref: '#/components/schemas/Ulid' }
        username: { type: string }
        display_name: { $ref: '#/components/schemas/NullableString' }
    HubPluginSummary:
      type: object
      required: [plugin_id, name]
      properties:
        plugin_id: { type: string, pattern: '^[a-z0-9][a-z0-9._-]{1,63}$' }
        name: { type: string }
        description: { type: string }
        icon: { type: string }
        category: { type: string }
        tags:
          type: array
          maxItems: 8
          items: { type: string, maxLength: 24 }
        owner: { $ref: '#/components/schemas/HubOwner' }
        latest_version: { type: string }
        size: { type: integer, format: int64 }
        downloads: { type: integer, format: int64 }
        versions_count: { type: integer }
        updated_at: { $ref: '#/components/schemas/Timestamp' }
        installed: { type: boolean }
        installed_version: { $ref: '#/components/schemas/NullableString' }
        update_available: { type: boolean }
        has_source:
          type: boolean
          description: Whether the latest version has a source package (per-version truth is in the detail versions[]).
        install_enabled: { type: boolean, description: Null when not installed. }
    HubVersion:
      type: object
      required: [version]
      properties:
        version: { type: string }
        asset_name: { type: string }
        size: { type: integer, format: int64 }
        sha256: { type: string, pattern: '^[0-9a-f]{64}$' }
        changelog: { type: string }
        manifest:
          type: object
          additionalProperties: true
          description: Manifest snapshot submitted by the publisher (consistency with the plugin.json inside the package is verified by the installer as a fallback).
        downloads: { type: integer, format: int64 }
        published_at: { $ref: '#/components/schemas/Timestamp' }
        status:
          type: string
          enum: [pending, review, published, rejected, removed]
          description: |-
            Review state (migration 0012). Only `published` is visible/installable to other users.
            `review`/`rejected`/`pending` rows are returned only to the owner and admins.
        submitted_at:
          allOf: [{ $ref: '#/components/schemas/Timestamp' }]
          description: Owner/admin only; latest submit-for-review time.
        review_note:
          type: string
          nullable: true
          description: Owner/admin only; rejection reason written by the administrator.
        reviewed_at:
          allOf: [{ $ref: '#/components/schemas/Timestamp' }]
          description: Owner/admin only; last review action time.
        has_source: { type: boolean }
        source_asset_name: { $ref: '#/components/schemas/NullableString' }
        source_size: { type: integer, format: int64 }
        source_sha256: { $ref: '#/components/schemas/NullableString' }
    HubInstallRef:
      type: object
      description: '`my_install` is always present and is null when not installed.'
      properties:
        version: { type: string }
        enabled: { type: boolean }
        data_rev: { type: integer, format: int64 }
        data_updated_at: { $ref: '#/components/schemas/Timestamp' }
    HubPluginDetail:
      description: |-
        Plugin details. For every other user `versions` contains published versions only; the owner and
        admins also see `pending`/`review`/`rejected` rows (with `status`/`review_note`). Ordered by
        `published_at desc`, then creation time.
      allOf:
        - $ref: '#/components/schemas/HubPluginSummary'
        - type: object
          properties:
            readme: { type: string }
            created_at: { $ref: '#/components/schemas/Timestamp' }
            versions:
              type: array
              items: { $ref: '#/components/schemas/HubVersion' }
            my_install:
              oneOf:
                - $ref: '#/components/schemas/HubInstallRef'
                - type: 'null'
    HubPluginPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/HubPluginSummary' }
        total: { type: integer }
        page: { type: integer }
        page_size: { type: integer }
    HubSourceDeclaration:
      type: object
      required: [asset_name, size, sha256]
      description: Source package declaration for this version (omitted = no source; once declared it cannot change during the lifecycle).
      properties:
        asset_name: { type: string, maxLength: 128, description: '`.zip` file name; path separators are forbidden.' }
        size: { type: integer, format: int64, minimum: 1, maximum: 52428800 }
        sha256: { type: string, pattern: '^[0-9a-f]{64}$' }
    HubPublishRequest:
      type: object
      required: [plugin_id, version, name, asset_name, size, sha256, manifest]
      description: 'Publish (create plugin / add version). Two-step: metadata first (201 draft), then upload the package body with `PUT .../blob`.'
      properties:
        plugin_id: { type: string, pattern: '^[a-z0-9][a-z0-9._-]{1,63}$' }
        version: { type: string, description: Semver (design §17.16). }
        name: { type: string, maxLength: 64 }
        description: { type: string, maxLength: 500 }
        readme: { type: string, description: '≤16KiB; omitting it in later versions keeps the existing readme.' }
        icon: { type: string, maxLength: 512 }
        category: { type: string, default: other }
        tags:
          type: array
          maxItems: 8
          items: { type: string, maxLength: 24 }
        changelog: { type: string, maxLength: 2000 }
        asset_name: { type: string, description: Installation package file name (path separators forbidden). }
        size: { type: integer, format: int64, minimum: 1, maximum: 20971520 }
        sha256: { type: string, pattern: '^[0-9a-f]{64}$' }
        manifest:
          type: object
          additionalProperties: true
          description: '`manifest.id` must equal `plugin_id`, and `manifest.version` must equal `version`.'
        source: { $ref: '#/components/schemas/HubSourceDeclaration' }
    HubUploadTarget:
      type: object
      properties:
        method: { type: string, enum: [PUT] }
        path: { type: string }
        headers:
          type: object
          additionalProperties: { type: string }
        max_bytes: { type: integer, format: int64 }
        expires_at: { $ref: '#/components/schemas/Timestamp' }
    HubVersionDraft:
      type: object
      properties:
        version: { type: string }
        status: { type: string, enum: [pending, review, published, rejected, removed] }
        size: { type: integer, format: int64 }
        sha256: { type: string }
        has_source: { type: boolean }
        source_asset_name: { $ref: '#/components/schemas/NullableString' }
        source_size: { type: integer, format: int64 }
        source_sha256: { $ref: '#/components/schemas/NullableString' }
    HubPublishResponse:
      type: object
      description: |-
        Publish draft (201) / idempotent retry (200). `idempotent_reused=true` (retry when the same version and sha were not uploaded)
        or `idempotent=true` (the same version and sha are already published, `upload:null`).
      properties:
        plugin: { $ref: '#/components/schemas/HubPluginSummary' }
        version: { $ref: '#/components/schemas/HubVersionDraft' }
        upload:
          oneOf:
            - $ref: '#/components/schemas/HubUploadTarget'
            - type: 'null'
        source_upload:
          oneOf:
            - $ref: '#/components/schemas/HubUploadTarget'
            - type: 'null'
        idempotent_reused: { type: boolean }
        idempotent: { type: boolean }
        submitted: { type: boolean, description: The same package is already waiting for review (upload null). }
    HubBlobUploadResponse:
      type: object
      properties:
        plugin_id: { type: string }
        version: { type: string }
        status:
          type: string
          enum: [review, published]
          description: '`review` = stored and waiting for an administrator; `published` = already approved (idempotent retry).'
        sha256: { type: string }
        size: { type: integer, format: int64 }
        published_at: { $ref: '#/components/schemas/Timestamp' }
        submitted_at: { $ref: '#/components/schemas/Timestamp' }
        review_required: { type: boolean }
        download_path: { type: string }
        idempotent: { type: boolean }
    HubSourceUploadResponse:
      type: object
      properties:
        plugin_id: { type: string }
        version: { type: string }
        status: { type: string, enum: [pending, review, published, rejected] }
        source_asset_name: { type: string }
        source_size: { type: integer, format: int64 }
        source_sha256: { type: string }
        download_path: { type: string }
        idempotent: { type: boolean }
    HubInstall:
      type: object
      required: [plugin_id]
      properties:
        plugin_id: { type: string }
        version: { type: string }
        enabled: { type: boolean }
        data_rev: { type: integer, format: int64 }
        data_updated_at: { $ref: '#/components/schemas/Timestamp' }
        last_device: { $ref: '#/components/schemas/NullableString' }
        updated_at: { $ref: '#/components/schemas/Timestamp' }
        plugin:
          oneOf:
            - type: object
              properties:
                name: { type: string }
                icon: { type: string }
                latest_version: { type: string }
            - type: 'null'
        data:
          type: object
          additionalProperties: true
          description: Returned only with `?include_data=1`.
    HubInstallPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/HubInstall' }
    HubInstallUpsertRequest:
      type: object
      description: |-
        Install record upsert (idempotent, per user). With `data` omitted, only version/enabled are updated; when `data` is present,
        `data_rev` is required (0 for new records), and a mismatch with the server → 409 `data_conflict`; `?force=1` overrides explicitly.
      properties:
        version: { type: string }
        enabled: { type: boolean }
        data:
          type: object
          additionalProperties: true
          description: Plugin data snapshot (JSON, ≤256KiB).
        data_rev: { type: integer, format: int64 }
        device_id: { type: string }
    HubMyPlugin:
      type: object
      description: |-
        `GET /v1/hub/mine` row. `state` reflects what the owner must act on: an approved plugin stays
        `published` even while a newer version is `review` (`review_version` is set alongside).
      properties:
        plugin_id: { type: string }
        name: { type: string }
        description: { type: string }
        icon: { $ref: '#/components/schemas/NullableString' }
        category: { type: string }
        tags:
          type: array
          items: { type: string }
        status: { type: string, description: 'Plugin row status (`published` / `removed`).' }
        state: { type: string, enum: [published, review, rejected, pending] }
        latest_version: { $ref: '#/components/schemas/NullableString' }
        versions_count: { type: integer }
        review_version: { $ref: '#/components/schemas/NullableString' }
        rejected_version: { $ref: '#/components/schemas/NullableString' }
        rejected_note: { $ref: '#/components/schemas/NullableString' }
        created_at: { $ref: '#/components/schemas/Timestamp' }
        updated_at: { $ref: '#/components/schemas/Timestamp' }
    HubMyPluginPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/HubMyPlugin' }
    HubReviewItem:
      type: object
      description: One version waiting for an administrator (`GET /v1/admin/hub/reviews`).
      properties:
        plugin_id: { type: string }
        name: { type: string }
        owner: { $ref: '#/components/schemas/HubOwner' }
        version: { type: string }
        asset_name: { type: string }
        size: { type: integer, format: int64 }
        sha256: { type: string }
        changelog: { type: string }
        has_source: { type: boolean }
        submitted_at: { $ref: '#/components/schemas/Timestamp' }
    HubReviewPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/HubReviewItem' }
        total: { type: integer }
        page: { type: integer }
        page_size: { type: integer }
    HubRejectRequest:
      type: object
      required: [reason]
      properties:
        reason: { type: string, minLength: 1, maxLength: 500, description: Shown to the publisher as `review_note`. }
    HubStats:
      type: object
      properties:
        plugins: { type: integer }
        versions: { type: integer }
        installs: { type: integer }
        downloads_total: { type: integer, format: int64 }
        storage_bytes:
          type: integer
          format: int64
          description: Sum of `hub_plugin_versions.size` (display value; may briefly diverge from actual bucket usage).
        top:
          type: array
          items:
            type: object
            properties:
              plugin_id: { type: string }
              name: { type: string }
              downloads: { type: integer, format: int64 }
        recent:
          type: array
          items:
            type: object
            properties:
              plugin_id: { type: string }
              version: { type: string }
              published_at: { $ref: '#/components/schemas/Timestamp' }

paths:
  # ==========================================================================
  # §6 Probes (no authentication)
  # ==========================================================================
  /v1/health:
    get:
      tags: [probes]
      operationId: health
      summary: Liveness probe (200 while the process responds; dependencies not probed)
      description: ⑤ §6. Does not check PG/Redis/bus; returns 200 as long as the process is alive.
      security: []
      responses:
        '200':
          description: Alive.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HealthResponse' }
      x-doc-ref: '⑤ §6'

  /v1/ready:
    get:
      tags: [probes]
      operationId: ready
      summary: Readiness probe (PG/Redis/bus health checks)
      description: |-
        ⑤ §6. Any unavailable dependency returns 503 with `details.dep`; `degraded` (for example Redis degradation) does not return 503.
        Draining (SIGTERM / drain) returns 503 immediately (`details.reason=draining`), so the LB removes the node from rotation.
      security: []
      responses:
        '200':
          description: Ready (dependencies available or degraded).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReadyResponse' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
      x-doc-ref: '⑤ §6'

  # ==========================================================================
  # §1 Auth
  # ==========================================================================
  /v1/auth/login:
    post:
      tags: [auth]
      operationId: authLogin
      summary: Username/password login (issues access JWT + refresh token)
      description: |-
        ⑤ §1.1. Rate limiting: 10/min per IP and 5/min per account (failed attempts counted, exponential lockout up to 15min).
        A device fingerprint mismatch creates a new device record; when `device_fp` is omitted, the server generates one and returns it in
        `device.fingerprint` (the client must report it verbatim in the WS `hello`). Writes audit `login`.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '200':
          description: Login succeeded.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/Format' }
        '429': { $ref: '#/components/responses/RateLimited' }
      x-doc-ref: '⑤ §1.1'
      x-idempotency: supported

  /v1/auth/refresh:
    post:
      tags: [auth]
      operationId: authRefresh
      summary: Refresh access JWT + rotate refresh token
      description: |-
        ⑤ §1.2. **Rotation semantics**: reusing the same refresh token returns 409 `CONFLICT` and revokes the entire
        refresh chain (a sign of theft); a device fingerprint mismatch → 401 (forced re-login). The refresh token may be passed in the body
        or in `Authorization: Bearer`.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RefreshRequest' }
      responses:
        '200':
          description: Refresh succeeded (new refresh + access tokens).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/RateLimited' }
      x-doc-ref: '⑤ §1.2'
      x-idempotency: rotation_not_supported

  /v1/auth/logout:
    post:
      tags: [auth]
      operationId: authLogout
      summary: Logout (revokes the current refresh token)
      description: ⑤ §1.3. Revokes the current device refresh (`devices.revoked_at`); repeat calls on a revoked token still return 204.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '204': { description: Logged out (empty body). }
        '401': { $ref: '#/components/responses/Unauthorized' }
      x-doc-ref: '⑤ §1.3'
      x-idempotency: supported

  # ==========================================================================
  # §2 Users and devices
  # ==========================================================================
  /v1/me:
    get:
      tags: [users]
      operationId: me
      summary: Current identity snapshot (user / device / online devices / queue depth)
      description: ⑤ §2. Client startup snapshot; v0.14 added `username`/`display_name`.
      responses:
        '200':
          description: Current identity.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MeResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
      x-doc-ref: '⑤ §2'

  /v1/users/me:
    get:
      tags: [users]
      operationId: getUsersMe
      summary: My profile (role / display_name / updated_at)
      description: ⑤ §2. Does not return `password_hash`.
      responses:
        '200':
          description: My profile.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserPublic' }
        '401': { $ref: '#/components/responses/Unauthorized' }
      x-doc-ref: '⑤ §2'
    patch:
      tags: [users]
      operationId: patchUsersMe
      summary: Update my display_name / avatar
      description: |-
        ⑤ §2. An empty string clears a field; avatar accepts an https URL or `data:image/(png|jpeg|webp|gif);base64`
        (≤256KiB). Writes audit `self.update` (the raw avatar is not recorded).
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UserPatchRequest' }
      responses:
        '200':
          description: Updated profile.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserPublic' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/Format' }
      x-doc-ref: '⑤ §2'
      x-idempotency: supported

  /v1/users/me/password:
    post:
      tags: [users]
      operationId: changeOwnPassword
      summary: Change my password
      description: |-
        ⑤ §2. Verifies the old password, rehashes with argon2id, and **keeps the current device while revoking all others**; a wrong old password returns
        422 (`details.reason=old_password`; not 401, to avoid false session-expiry signals). Writes audit `self.password_change`.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PasswordChangeRequest' }
      responses:
        '200':
          description: Changed.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OkOk' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/Format' }
      x-doc-ref: '⑤ §2'
      x-idempotency: supported

  /v1/users/{id}:
    parameters:
      - name: id
        in: path
        required: true
        description: User ULID.
        schema: { $ref: '#/components/schemas/Ulid' }
    get:
      tags: [users]
      operationId: getUser
      summary: User profile + capability declarations + quota (self / admin)
      description: ⑤ §2. `capabilities` are declarations, not guarantees (authoritative device capabilities come from `hello.caps`).
      responses:
        '200':
          description: User profile.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserPublic' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
      x-doc-ref: '⑤ §2'
    patch:
      tags: [users]
      operationId: patchUser
      summary: 'Partially update a user (self: display_name / capabilities only)'
      description: ⑤ §2. Admin changes to other users' profiles go through `PATCH /v1/admin/users/{id}` (reason required).
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UserPatchRequest' }
      responses:
        '200':
          description: Updated profile.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserPublic' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Format' }
      x-doc-ref: '⑤ §2'
      x-idempotency: supported

  /v1/users/{id}/devices:
    parameters:
      - name: id
        in: path
        required: true
        description: User ULID.
        schema: { $ref: '#/components/schemas/Ulid' }
    get:
      tags: [users]
      operationId: listUserDevices
      summary: Device list (revoked_at null means active)
      description: ⑤ §2. Readable by the owner / admin.
      responses:
        '200':
          description: Device list.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/DeviceInfo' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
      x-doc-ref: '⑤ §2'

  /v1/devices/{id}:
    parameters:
      - name: id
        in: path
        required: true
        description: Device ULID.
        schema: { $ref: '#/components/schemas/Ulid' }
    delete:
      tags: [users]
      operationId: revokeOwnDevice
      summary: Revoke a device token (remote logout)
      description: ⑤ §2. Returns 204 on success; repeat revocations are treated as idempotent.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '204': { description: Revoked (empty body). }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
      x-doc-ref: '⑤ §2'
      x-idempotency: supported

  # ==========================================================================
  # §3 Conversations
  # ==========================================================================
  /v1/conversations:
    post:
      tags: [conversations]
      operationId: createConversation
      summary: Create a conversation / group (repeated dm creation idempotently returns the existing conversation)
      description: ⑤ §3. With `kind=dm`, `member_ids` must contain exactly one user; repeat calls return the existing conversation (200).
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ConversationCreateRequest' }
      responses:
        '200':
          description: Already exists (dm idempotent path only).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Conversation' }
        '201':
          description: Created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Conversation' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/Format' }
      x-doc-ref: '⑤ §3'
      x-idempotency: supported
    get:
