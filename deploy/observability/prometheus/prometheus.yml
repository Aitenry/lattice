# =============================================================================
# Lattice observability — Prometheus scrape config (dev / single-node example)
# =============================================================================
# single source of metric names: crates/lattice-node/src/observe/metrics.rs
# spec reference: the platform implementation document (outside this repository) §8.1 (metrics) / §8.3 (alerts)
#
# scrape paths (measured 2026-11-21):
#   1) node:9100/metrics          — **main path (enabled by default)**. The standalone metrics endpoint defined in doc §8.1,
#      provided by observe/metrics_server.rs: unauthenticated, read-only, bind decided by [node] metrics
#      (default 127.0.0.1:9100; overridden in containers by LATTICE__NODE__METRICS=0.0.0.0:9100,
#      already mapped by deploy/compose/dev.yaml). Measured 200 from the container node at http://127.0.0.1:9100/metrics.
#   2) /v1/admin/metrics         — fallback (commented by default). Requires an admin JWT (RBAC);
#      JWT TTL=900s, so the token file must be refreshed periodically; kept for nodes with "old binaries/metrics listener disabled".
#      ⚠ only **one of the two options may be enabled**: scraping both duplicates every series (double counting/dashboard split).
#
# startup examples in deploy/observability/README.md.
# =============================================================================

global:
  scrape_interval: 15s
  scrape_timeout: 10s
  evaluation_interval: 15s
  external_labels:
    cluster: lattice-dev
    monitor: lattice-observability

# alert rules: in-container path; change to ./lattice-alerts.yml when running on the host directly
rule_files:
  - /etc/prometheus/lattice-alerts.yml
  # - ./lattice-alerts.yml

# alert delivery (optional): enable after deploying Alertmanager
# alerting:
#   alertmanagers:
#     - static_configs:
#         - targets: ['alertmanager:9093']

scrape_configs:
  # ---------------------------------------------------------------------------
  #   Option A (enabled by default): the standalone metrics endpoint from doc §8.1, /metrics (unauthenticated, read-only)
  #     pick one of three scrape targets depending on the deployment shape:
  #     * Prometheus runs in Docker (Docker Desktop) and the node port is mapped to the host
  #       (deploy/compose/dev.yaml maps 9100 to 0.0.0.0:9100) → host.docker.internal:9100
  #     * both Prometheus and node run directly on the host (metrics=127.0.0.1:9100 in .dev/local.toml)
  #       → 127.0.0.1:9100
  #     * Prometheus and node share the same compose network (service name node) → node:9100
  # ---------------------------------------------------------------------------
  - job_name: lattice-node
    metrics_path: /metrics
    scheme: http
    scrape_interval: 15s
    static_configs:
      - targets: ['host.docker.internal:9100']
        labels:
          env: dev
          node: lattice-dev-1
      #       change to the following line when Prometheus runs directly on the host:
      # - targets: ['127.0.0.1:9100']
      #       change to the following when Prometheus and node share a compose network:
      # - targets: ['node:9100']

  # ---------------------------------------------------------------------------
  #   Option B (fallback, commented by default): admin-plane metrics endpoint /v1/admin/metrics (requires an admin JWT)
  #   - applies when: the node binary has no metrics_server (old version) or [node] metrics is explicitly disabled.
  #   - the token file is generated by scripts/obs-refresh-admin-jwt.ps1 and refreshed every 5 minutes (JWT TTL=900s);
  #     Prometheus re-reads credentials_file on every scrape, so rotation needs no reload.
  #   - disable option A before enabling this job, to avoid scraping the same metrics twice.
  # ---------------------------------------------------------------------------
  # - job_name: lattice-node-admin-metrics
  #   metrics_path: /v1/admin/metrics
  #   scheme: http
  #   scrape_interval: 15s
  #   authorization:
  #     type: Bearer
  #     credentials_file: /etc/prometheus/lattice-admin.jwt
  #   static_configs:
  #     - targets: ['host.docker.internal:8080']
  #       # host-local Prometheus: ['127.0.0.1:8080']; inside the compose network: ['node:8080']
  #       labels:
  #         env: dev
  #         node: lattice-dev-1

  # ---------------------------------------------------------------------------
  #   Option C (optional, commented by default): /v1/ready blackbox probe — used by the "dependency unavailable" alert
  #   - metrics.rs currently has no dependency metrics (no dep_up-style gauge), and the deps state of /v1/ready
  #     cannot go straight into PromQL; with blackbox_exporter deployed the HTTP status code can be probed.
  #   - /v1/ready returns 503 only when PG and Redis are **both** unavailable (single-dependency degradation still returns 200),
  #     so this probe can only cover "all dependencies unavailable". See LatticeDependencyUnavailable in alerts.yml.
  # ---------------------------------------------------------------------------
  # - job_name: lattice-ready
  #   metrics_path: /probe
  #   params:
  #     module: [http_2xx]
  #   static_configs:
  #     - targets: ['http://host.docker.internal:8080/v1/ready']
  #       # host-local: ['http://127.0.0.1:8080/v1/ready']
  #   relabel_configs:
  #     - source_labels: [__address__]
  #       target_label: __param_target
  #     - source_labels: [__param_target]
  #       target_label: instance
  #     - target_label: __address__
  #       replacement: blackbox-exporter:9115
