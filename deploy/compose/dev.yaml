# ---------------------------------------------------------------------------
# Lattice dev stack — build and start the full stack (web + node + middleware) with one command
#
#   docker compose -f deploy/compose/dev.yaml up -d --build
#
# Start order: pg / redis / minio  ->  node + transfer  ->  web
# Buckets (lattice-large / -media / -cold) are created idempotently by node at startup (store/s3.rs::ensure_buckets),
# so one-shot containers such as minio-init are no longer needed.
# Entry points:
#   http://127.0.0.1:8088   web (nginx; /v1 reverse-proxied to node including WS upgrade, /t/ to transfer)
#   http://127.0.0.1:8080   node (direct, for debugging)
#   http://127.0.0.1:8090   transfer plane (download data plane; clients normally use /t/ via 8088)
#   http://127.0.0.1:9001   MinIO console
#
# Every service sets container_name explicitly so compose does not append a -1 suffix.
# ---------------------------------------------------------------------------
name: lattice-dev

services:
  pg:
    image: postgres:16-alpine
    container_name: lattice-dev-pg
    environment:
      POSTGRES_DB: lattice
      POSTGRES_USER: lattice_app
      POSTGRES_PASSWORD: lattice_dev_pw
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lattice_app -d lattice"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: lattice-dev-redis
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  minio:
    # Do not use :latest — the tag is often absent locally and up hangs on the pull
    image: minio/minio:RELEASE.2023-03-20T20-16-18Z
    container_name: lattice-dev-minio
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      # Must match [s3] access_key / secret_key in dev.toml, otherwise node uploads get 403
      MINIO_ROOT_USER: lattice_dev
      MINIO_ROOT_PASSWORD: lattice_dev_secret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      # This image has no mc (only curl). "mc ready local" would stay unhealthy forever.
      # Node creates the buckets itself, but minio must still be healthy or node will not start.
      test: ["CMD", "curl", "-f", "http://127.0.0.1:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    restart: unless-stopped

  # NATS JetStream (P3 bus main path; redis-pubsub remains the default, switch with [bus] kind=nats)
  nats:
    image: nats:2.10-alpine
    container_name: lattice-dev-nats
    command: ["-js", "-sd", "/data", "-m", "8222"]
    ports:
      - "4222:4222"   # client
      - "8222:8222"   # monitoring /healthz
    volumes:
      - natsdata:/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8222/healthz"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
    restart: unless-stopped

  node:
    image: lattice-node:dev
    build:
      context: ../..
      dockerfile: deploy/Dockerfile.node
    container_name: lattice-dev-node
    depends_on:
      pg:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      RUST_LOG: "info,lattice_node=debug"
      # The hosts in dev.toml are already container service names (pg / redis / minio),
      # so nothing needs overriding inside containers; only override them to 127.0.0.1 when running directly on the host.
      # dev.toml binds the metrics port to 127.0.0.1:9100, and inside a container it must listen on all interfaces to be scraped
      LATTICE__NODE__METRICS: "0.0.0.0:9100"
      # Batch plugin releases: raise the hub publish quota (default 10/hour) for the dev stack.
      LATTICE_HUB_PUBLISH_LIMIT: "100"
    ports:
      - "8080:8080"
      # MQTT gateway (P3, ⑤ §11): [mqtt] enabled=true in dev.toml; TLS is terminated by the front proxy
      - "1883:1883"
      # Prometheus scrape endpoint (② §8.1): unauthenticated, read-only; restrict sources with NetworkPolicy in production
      - "9100:9100"
      # Internal gRPC (⑤ §10): plaintext in dev; production requires mTLS and internal-only exposure
      - "9090:9090"
    volumes:
      # Persist the key directory: otherwise every rebuild swaps the signing key and all issued tokens become invalid
      - nodekeys:/etc/lattice/keys
    restart: unless-stopped

  # Download transfer plane (design §6.10): stateless, streams objects from MinIO behind a
  # short-lived capability token. nginx routes /t/ here; the node never proxies object bytes.
  # Same image as the node, different entrypoint. Scale it independently in production (Helm).
  transfer:
    image: lattice-node:dev
    build:
      context: ../..
      dockerfile: deploy/Dockerfile.node
    container_name: lattice-dev-transfer
    entrypoint: ["/usr/local/bin/lattice-transfer"]
    command: ["--config", "/etc/lattice/config.toml"]
    depends_on:
      minio:
        condition: service_healthy
    environment:
      RUST_LOG: "info,lattice_node=debug"
    ports:
      # Exposed for direct debugging and the readiness/metrics probes; clients normally use
      # http://127.0.0.1:8088/t/... through nginx.
      - "127.0.0.1:8090:8090"
      - "127.0.0.1:9101:9101"
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8090 && printf \"GET /healthz HTTP/1.0\\r\\n\\r\\n\" >&3 && cat <&3 | grep -q ok'"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    restart: unless-stopped

  # TURN (coturn, deployed separately; design §17.9 / deploy/coturn/README.md).
  # Off by default (profile: turn) to avoid occupying UDP ports and disrupting daily dev;
  # the node's [media] turn_uris points to turn:127.0.0.1:3478 with the same secret as here.
  turn:
    image: coturn/coturn:4.6.2
    container_name: lattice-dev-turn
    profiles: ["turn"]
    ports:
      - "3478:3478/udp"
      - "3478:3478/tcp"
    environment:
      TURN_SECRET: ${TURN_SECRET:-lattice_dev_turn_secret}
    command:
      - "-n"
      - "--log-file=stdout"
      - "--lt-cred-mech"
      - "--use-auth-secret"
      - "--static-auth-secret=${TURN_SECRET:-lattice_dev_turn_secret}"
      - "--realm=lattice.dev"
      - "--fingerprint"
      - "--no-cli"
      - "--no-tls"
      - "--no-dtls"
      - "--min-port=49160"
      - "--max-port=49190"
      - "--external-ip=127.0.0.1"
    restart: unless-stopped

  web:
    image: lattice-web:dev
    build:
      context: ../..
      dockerfile: deploy/Dockerfile.web
    container_name: lattice-dev-web
    depends_on:
      node:
        condition: service_healthy
      transfer:
        condition: service_healthy
    ports:
      - "8088:80"
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
  miniodata:
  natsdata:
  nodekeys:
