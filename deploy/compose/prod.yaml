# ---------------------------------------------------------------------------
# Lattice production-profile stack (single host)
#
#   docker compose -f deploy/compose/prod.yaml up -d
#
# This is the isolated production instance. It runs next to the development stack
# (deploy/compose/dev.yaml) without sharing containers, networks, volumes, credentials
# or host ports:
#
#   http://127.0.0.1:8089   console (nginx; /v1 and /t/ reverse-proxied)
#   http://127.0.0.1:8180   node directly (health/debug; loopback only)
#   http://127.0.0.1:8190   transfer plane directly (loopback only)
#   http://127.0.0.1:9002   MinIO S3 API (loopback only)
#   http://127.0.0.1:9003   MinIO console (loopback only)
#   127.0.0.1:5433/6380/4223/1884   PostgreSQL / Redis / NATS / MQTT (loopback only)
#   http://127.0.0.1:9110/metrics, http://127.0.0.1:9111/metrics  node / transfer
#
# Secrets live in deploy/config/prod.env (git-ignored, generated by
# deploy/migrate/init-prod.ps1). Nothing security-relevant is baked into the image:
# the production TOML is mounted read-only over the development default.
#
# Start order: pg / redis / minio / nats -> node + transfer -> web
# ---------------------------------------------------------------------------
name: lattice-prod

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "5"

x-hardening: &hardening
  security_opt:
    - no-new-privileges:true

services:
  pg:
    image: postgres:16-alpine
    container_name: lattice-prod-pg
    env_file: ../config/prod.env
    environment:
      POSTGRES_DB: lattice
      POSTGRES_USER: lattice_app
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    shm_size: 256mb
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lattice_app -d lattice"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    restart: unless-stopped
    mem_limit: 1g
    logging: *default-logging
    <<: *hardening

  redis:
    image: redis:7-alpine
    container_name: lattice-prod-redis
    env_file: ../config/prod.env
    # $$ escapes Compose interpolation: the shell inside the container expands the
    # password from the environment injected by env_file, so it never sits in the
    # Compose file or in `docker inspect`'s command.
    command: ["sh", "-c", "exec redis-server --appendonly yes --requirepass \"$$REDIS_PASSWORD\""]
    ports:
      - "127.0.0.1:6380:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    mem_limit: 512m
    logging: *default-logging
    <<: *hardening

  minio:
    # Pinned release: never use :latest
    image: minio/minio:RELEASE.2023-03-20T20-16-18Z
    container_name: lattice-prod-minio
    env_file: ../config/prod.env
    command: ["server", "/data", "--console-address", ":9001"]
    ports:
      - "127.0.0.1:9002:9000"
      - "127.0.0.1:9003:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    restart: unless-stopped
    mem_limit: 1g
    logging: *default-logging
    <<: *hardening

  nats:
    image: nats:2.10-alpine
    container_name: lattice-prod-nats
    # No application-level auth: the node's NATS client (async-nats 0.53) only takes a
    # URL without userinfo, so a user/password here would be silently ignored. The
    # client port is bound to loopback and only the node/transfer join this network;
    # a real multi-host deployment keeps NATS on a private segment (deploy/production/nats).
    command: ["-js", "-sd", "/data", "-m", "8222"]
    ports:
      - "127.0.0.1:4223:4222"
      - "127.0.0.1:8223:8222"
    volumes:
      - natsdata:/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8222/healthz"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
    restart: unless-stopped
    mem_limit: 512m
    logging: *default-logging
    <<: *hardening

  node:
    image: lattice-node:prod
    container_name: lattice-prod-node
    env_file: ../config/prod.env
    environment:
      # Batch plugin releases: raise the hub publish quota (default 10/hour; see hub.rs publish_rate_limit).
      LATTICE_HUB_PUBLISH_LIMIT: "100"
    # A freshly created named volume is owned by root, so the container starts as root
    # just long enough to hand /var/lib/lattice/wal to UID 10001 and then execs the node
    # as 10001. No separate init container is left behind, and a fresh `down -v` volume
    # is still handled correctly.
    user: "0:0"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        chown -R 10001:10001 /var/lib/lattice/wal &&
        exec setpriv --reuid=10001 --regid=10001 --clear-groups \
          /usr/local/bin/lattice-node --config /etc/lattice/config.toml
    depends_on:
      pg:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      nats:
        condition: service_healthy
    volumes:
      # Mount the production profile over the development config baked into the image.
      - ../config/prod.toml:/etc/lattice/config.toml:ro
      - nodekeys:/etc/lattice/keys
      - waldata:/var/lib/lattice/wal
    ports:
      - "127.0.0.1:8180:8080"
      # MQTT gateway; TLS/mTLS terminates at the edge in real production.
      - "127.0.0.1:1884:1883"
      - "127.0.0.1:9110:9100"
    restart: unless-stopped
    mem_limit: 1g
    logging: *default-logging
    <<: *hardening

  # Download data plane (design §6.10): stateless, streams objects from MinIO behind a
  # short-lived capability token. nginx routes /t/ here; the node never proxies bytes.
  transfer:
    image: lattice-node:prod
    container_name: lattice-prod-transfer
    entrypoint: ["/usr/local/bin/lattice-transfer"]
    command: ["--config", "/etc/lattice/config.toml"]
    env_file: ../config/prod.env
    depends_on:
      minio:
        condition: service_healthy
    volumes:
      - ../config/prod.toml:/etc/lattice/config.toml:ro
    ports:
      - "127.0.0.1:8190:8090"
      - "127.0.0.1:9111:9101"
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8090 && printf \"GET /healthz HTTP/1.0\\r\\n\\r\\n\" >&3 && cat <&3 | grep -q ok'"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    restart: unless-stopped
    mem_limit: 512m
    logging: *default-logging
    <<: *hardening

  web:
    image: lattice-web:prod
    container_name: lattice-prod-web
    depends_on:
      node:
        condition: service_healthy
      transfer:
        condition: service_healthy
    ports:
      - "8089:80"
    restart: unless-stopped
    mem_limit: 256m
    logging: *default-logging
    <<: *hardening

volumes:
  pgdata:
  redisdata:
  miniodata:
  natsdata:
  nodekeys:
  waldata:
