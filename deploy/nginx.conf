# nginx site configuration for lattice-web
#  - static assets: SPA fallback to index.html
#  - /v1/admin/stream : SSE, buffering must be off or nginx holds events back
#  - /v1/ws           : WebSocket upgrade
#  - /v1/*            : regular reverse proxy
#
# The frontend hardcodes baseURL to '/v1' (web/src/api/http.ts::BASE), so /v1 must be proxied here.

upstream lattice_node {
    server node:8080;
    keepalive 32;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Large messages go through the upload path; the real 1MB limit is returned by the backend decision layer as a contract error
    client_max_body_size 8m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Build artifacts are hashed, so they can be cached long-term
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-store";
    }

    # SSE: disable buffering + long timeout, otherwise nothing is delivered beyond the 30s heartbeat of /v1/admin/stream
    location = /v1/admin/stream {
        proxy_pass http://lattice_node;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # WebSocket: the Upgrade / Connection headers are mandatory
    location /v1/ws {
        proxy_pass http://lattice_node;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }

    location /v1/ {
        proxy_pass http://lattice_node;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
