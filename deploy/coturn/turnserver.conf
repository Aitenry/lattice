# coturn standalone deployment config (production template; dev uses the turn profile in deploy/compose/dev.yaml)
#
# Authority: design §17.9 (separate TURN deployment, credentials ≤10min), ⑤ §9.7 (nodes issue credentials),
#       ② §4.2.1 ([media] turn_uris/turn_secret/turn_ttl).
#
# Usage: render static-auth-secret from a Secret/env into a copy of this file, then start
#   turnserver -c /etc/coturn/turnserver.conf
# This file holds no real secret (the repository copy contains placeholders only).

listening-port=3478
# TURN over TLS (recommended on the public internet): tls-listening-port=5349
# cert=/etc/coturn/tls/turn.crt
# pkey=/etc/coturn/tls/turn.key
# cipher-list="ECDHE+AESGCM:ECDHE+CHACHA20"

realm=lattice.example.com
fingerprint
lt-cred-mech
use-auth-secret
static-auth-secret=REPLACE_WITH_SECRET_FROM_SECRET_MANAGER

# Relay port range: adjust to the number of concurrent streams; cloud security groups/NetworkPolicy must allow UDP
min-port=49160
max-port=49200

# Set the public address in production (required with multiple NICs/NAT, otherwise clients receive private candidates)
# external-ip=TURN_PUBLIC_IP

# Security baseline: disable the CLI, forbid anonymous access, cap total bandwidth (bps)
no-cli
no-multicast-peers
# total-quota=2000
# bps-capacity=0

# Logs go to stdout for the container/collector; never log credentials in plaintext
log-file=stdout
simple-log
verbose=false

# TLS/DTLS enabled in production; plaintext 3478 in dev is intranet-only
# no-tls
# no-dtls
