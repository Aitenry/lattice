# =============================================================================
# NATS production template — 3-node JetStream cluster (node nats-2)
# -----------------------------------------------------------------------------
# The three files nats-0/1/2.conf differ only in server_name; cluster.routes is identical on all three.
# Production rendering: inject passwords/TLS certificate paths from a Secret (NATS does not expand
# environment variables — use envsubst/Ansible).
# Start: nats-server -c /etc/nats/nats-2.conf
#
# [CRITICAL, READ FIRST] Stream replica counts are not in this file:
#   The node's `store/bus.rs`/`store/nats.rs` create 4 Streams via async-nats `get_or_create_stream`
#   (LATTICE_ROUTE / LATTICE_BROADCAST / LATTICE_AUDIT / LATTICE_MEDIA), but in code
#   `stream::Config::default()` has replicas = **1** (the replica count is not read from configuration).
#   async-nats get_or_create semantics = "if it already exists, reuse it as-is, no config comparison"
#   (cargo-vendor2/async-nats/src/jetstream/context.rs:805-837).
#   => If the node creates them itself: Streams in a 3-node cluster have only 1 replica, so a node
#      failure loses that node's Stream data.
#   => Production **must pre-create the Streams with replicas=3 using deploy/production/nats/streams.sh
#      first**; the node reuses them when its HEAD/INFO lookup succeeds (parameters match the code's
#      stream_specs(), see the streams.sh comments).
# =============================================================================
server_name: nats-2
listen: 0.0.0.0:4222
# Monitoring/health port (Prometheus nats exporter or /healthz, /jsz); never expose it to the internet
http: 0.0.0.0:8222

# Per-connection/payload limits: a single WS frame ≤512KB (design §17.13); leave headroom on the NATS
# side for envelope expansion
max_connections: 65536
max_payload: 4MB
write_deadline: 10s
lame_duck_duration: 30s

# --- JetStream (persisted at /data/jetstream; File storage) -------------------
jetstream {
  store_dir: /data/jetstream
  # Set memory/disk limits from a capacity estimate; once exceeded, publishes return errors (the node
  # degrades, see the [bus] degradation matrix)
  max_mem_store: 2G
  max_file_store: 200G
  # Interval for syncing to disk; not recommended to disable in production (default 2m)
  sync_interval: 2m
}

# --- Cluster (3-node Raft; both the JetStream meta group and Stream replicas rely on it) ---
cluster {
  name: lattice-bus
  listen: 0.0.0.0:6222
  routes = [
    nats-route://nats-0:6222
    nats-route://nats-1:6222
    nats-route://nats-2:6222
  ]
  # [enable in production] Mutual TLS inside the cluster (same certificate chain as clients, separate CNs)
  # tls {
  #   cert_file: /etc/nats/tls/server.crt
  #   key_file: /etc/nats/tls/server.key
  #   ca_file: /etc/nats/tls/ca.crt
  #   verify: true
  #   timeout: 5
  # }
}

# --- Client authentication ([enable in production]; template placeholder, mandatory in production) ---
# The node-side [bus] nats_url carries only a URL, so in production prefer a token or NKey over putting a
# password in the URL:
#   LATTICE__BUS__NATS_URL=nats://lattice-nats.lattice.internal:4222
#   (NATS user/password auth must be embedded in the URL; NKey/JWT with client-side injection is better)
# authorization {
#   users = [
#     { user: lattice, password: ${NATS_PASSWORD} }
#   ]
# }
# [enable in production] Client TLS (4222)
# tls {
#   cert_file: /etc/nats/tls/server.crt
#   key_file: /etc/nats/tls/server.key
#   ca_file: /etc/nats/tls/ca.crt
#   verify: true
# }

# Logging: stdout is collected by systemd/the container runtime (no local rotating file)
debug: false
trace: false
logtime: true
