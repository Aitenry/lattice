# =============================================================================
# Redis Sentinel production template (×3 hosts; all three use identical content)
# -----------------------------------------------------------------------------
# Only Sentinel performs "leader election": it monitors the master named `lattice` with quorum=2 (a
# failover is triggered only when ≥2 of the 3 Sentinels consider the primary failed; one Sentinel may be
# down without impact).
#
# Render the placeholders before deploying (Redis does not expand environment variables):
#   export REDIS_PASSWORD=... REDIS_MASTER_HOST=redis-0.lattice.internal
#   envsubst < sentinel.conf > /etc/redis/sentinel-0.conf
# The only recommended per-host difference: explicitly set `sentinel announce-ip <this Sentinel's internal IP>`
# on each host, otherwise other Sentinels cannot find it across NAT/multiple NICs (for hostname setups see
# resolve-hostnames below).
#
# Start: redis-sentinel /etc/redis/sentinel.conf
# Self-check:
#   redis-cli -p 26379 sentinel master lattice            # check ip/port/flags/quorum
#   redis-cli -p 26379 sentinel sentinels lattice        # do the other two Sentinels know it
#   redis-cli -p 26379 sentinel replicas lattice         # replica list
#
# Relationship to the node: the node's [redis] url accepts a single endpoint only (redis::Client::open) and
# does not speak the Sentinel protocol; a VIP/DNS/HAProxy must provide a stable write endpoint (HAProxy
# health-checks role:master from INFO replication). See deploy/production/README.md §5.2. During the
# switchover window the node sees connection errors → it reconnects automatically to the new primary.
# =============================================================================
port 26379
bind 0.0.0.0
protected-mode yes
daemonize no
dir /data
loglevel notice
logfile ""

# --- Monitoring (master name = lattice, quorum = 2) ---------------------------
# Note: put the **current primary's real address** here (not the VIP/HAProxy) — Sentinel monitors real
# nodes, otherwise it cannot elect a new primary among the replicas after failover. After a switchover
# Sentinel rewrites this to the new primary's address automatically.
sentinel monitor lattice ${REDIS_MASTER_HOST} 6379 2
sentinel auth-pass lattice ${REDIS_PASSWORD}

# --- Failure detection and switchover window ----------------------------------
# down-after: 5s to subjective down (no PING response); objective down requires quorum Sentinels to agree
sentinel down-after-milliseconds lattice 5000
# total failover timeout 60s (election, promotion, notification, replica reconfiguration); most of the
# ≤30min RTO target is the manual phase
sentinel failover-timeout lattice 60000
# Resync only 1 replica with the new primary at a time (the rest in turn) so the primary's bandwidth/IO is
# not saturated at the moment of switchover
sentinel parallel-syncs lattice 1
# Do not allow scripts/configuration to be changed at runtime (prevents privilege holes)
sentinel deny-scripts-reconfig yes

# --- hostname support (enable when using DNS across hosts; can be disabled when all addresses are fixed IPs) ---
sentinel resolve-hostnames yes
sentinel announce-hostnames yes
# Each host should announce its own address explicitly (recommended; replace with each host's internal IP in production):
# sentinel announce-ip ${SENTINEL_ANNOUNCE_IP}

# --- Sentinel authentication (optional: allow clients to control Sentinel via redis-cli) ---
# [enable in production] Enable TLS/auth on Sentinel too: clients need `redis-cli --tls -a ... -p 26379`
# requirepass ${SENTINEL_PASSWORD}
# [enable in production] TLS:
# port 0
# tls-port 26379
# tls-cert-file /etc/redis/tls/server.crt
# tls-key-file /etc/redis/tls/server.key
# tls-ca-cert-file /etc/redis/tls/ca.crt
# tls-auth-clients yes
# tls-replication yes

# Sentinel rewrites this file periodically (recording known sentinels/replicas and the current primary),
# so its directory must be writable; the configuration file must be mode 0600 (it holds auth-pass in
# plaintext).
