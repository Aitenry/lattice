# =============================================================================
# Redis production template — primary configuration for the "1 primary + 2 replicas" pair monitored by
# Sentinel ×3
# -----------------------------------------------------------------------------
# Authoritative parameters: the three templates in this directory (redis-master.conf /
# redis-replica.conf / sentinel.conf). Placeholders are rendered at deploy time (envsubst / Ansible
# template / confd); Redis itself does not expand environment variables.
# Production runs one set per host on 3 hosts (master/replica can also be co-located with sentinels, but
# do not put 3 sentinels on the same host).
#
# Relationship to node configuration (crates/lattice-node/src/config.rs):
#   [redis] url is a **single URL** (redis::Client::open; no Sentinel protocol implementation, no
#   multi-host list). The node therefore must connect to a stable endpoint: VIP / DNS / HAProxy
#   (health-checking role:master from INFO replication, see deploy/production/README.md §5.2). The node
#   cannot reach sentinel, so after a switchover it recovers via "endpoint moves + ConnectionManager
#   auto-reconnect"; this layer has not been validated on this machine.
#
# Responsibility boundary (important):
#   Redis is not the authoritative data source. Pending/seq/routing have a backstop in PG
#   (delivery_log / conv_seq_watermark), and the few writes lost in a switchover are backfilled by
#   reconcile (lock:reconcile). This template therefore allows asynchronous replication + AOF everysec
#   and does not target "zero loss on Redis"; treating Redis as the queue authority would require
#   synchronous writes plus a cluster, which is an unvalidated change.
# =============================================================================
bind 0.0.0.0
protected-mode yes
port 6379
tcp-backlog 511
timeout 0
tcp-keepalive 60

# --- Authentication (placeholders: rendered from a Secret in production; never commit real passwords) ---
requirepass ${REDIS_PASSWORD}
# In production prefer ACLs over a single requirepass (the node only uses a subset such as
# PUT/GET/ZADD/PUBLISH/SUBSCRIBE):
# aclfile /etc/redis/users.acl
# user lattice on >${REDIS_PASSWORD} ~lattice:* ~pending:* ~conn:* ~seq:* ~dedup:* resetchannels +@read +@write +@pubsub +@scripting

# --- Persistence (for switchover/restart recovery; AOF primary, RDB secondary) ---
dir /data
appendonly yes
appendfilename "appendonly.aof"
appendfsync everysec
no-appendfsync-on-rewrite yes
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 256mb
save 900 1
save 300 10
rdbcompression yes
rdbchecksum yes

# --- Memory and eviction ------------------------------------------------------
# Set per instance memory in production; noeviction: rather fail the write and let the application take
# the degradation path than silently evict pending routing data
maxmemory 4gb
maxmemory-policy noeviction

# --- Replication --------------------------------------------------------------
repl-backlog-size 64mb
repl-backlog-ttl 3600
repl-diskless-sync yes
repl-diskless-sync-delay 5
# min-replicas-to-write is not enforced: write failures on the Redis side make the node take the
# degradation path (② §4.8); if "never write without a synchronous replica" is required, uncomment the
# two lines below and accept that writes are unavailable while the primary runs alone:
# min-replicas-to-write 1
# min-replicas-max-lag 10

# --- Slow log / logging -------------------------------------------------------
slowlog-log-slower-than 10000
slowlog-max-len 256
loglevel notice
# [enable in production] TLS: native TLS in Redis 6+ (full client/Sentinel chain)
# port 0
# tls-port 6379
# tls-cert-file /etc/redis/tls/server.crt
# tls-key-file /etc/redis/tls/server.key
# tls-ca-cert-file /etc/redis/tls/ca.crt
# tls-auth-clients yes
