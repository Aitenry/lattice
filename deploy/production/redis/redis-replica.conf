# =============================================================================
# Redis production template — Sentinel-managed replica configuration (replica ×2)
# -----------------------------------------------------------------------------
# The only differences from redis-master.conf are: replicaof / replica-read-only / masterauth.
# All other persistence, memory policy, and TLS placeholders stay identical to the primary (so behavior
# does not change after a switchover).
# Placeholders: ${REDIS_PASSWORD}, ${REDIS_MASTER_HOST}, ${REPLICA_ANNOUNCE_IP}
# =============================================================================
bind 0.0.0.0
protected-mode yes
port 6379
tcp-backlog 511
timeout 0
tcp-keepalive 60

requirepass ${REDIS_PASSWORD}
# Password the replica uses to connect to the primary (on failover Sentinel also applies the new
# primary's auth-pass to the replicas)
masterauth ${REDIS_PASSWORD}

# --- Replication link (initially points at the current primary; after failover Sentinel rewrites it and
# the instance reconnects) ---
replicaof ${REDIS_MASTER_HOST} 6379
replica-read-only yes
replica-serve-stale-data yes
repl-diskless-load disabled
repl-backlog-size 64mb

# In production, explicitly announce this node's internal IP (required for NAT/multi-NIC setups and when
# Sentinel resolves by hostname).
# demo/compose can omit it (container DNS names), but cross-host deployments must set the real IP:
# replica-announce-ip ${REPLICA_ANNOUNCE_IP}
# replica-announce-port 6379

dir /data
appendonly yes
appendfilename "appendonly.aof"
appendfsync everysec
no-appendfsync-on-rewrite yes
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 256mb
save 900 1
save 300 10
rdbcompression yes
rdbchecksum yes

maxmemory 4gb
maxmemory-policy noeviction

slowlog-log-slower-than 10000
slowlog-max-len 256
loglevel notice

# [enable in production] TLS (same certificate chain as the primary)
# port 0
# tls-port 6379
# tls-cert-file /etc/redis/tls/server.crt
# tls-key-file /etc/redis/tls/server.key
# tls-ca-cert-file /etc/redis/tls/ca.crt
# tls-auth-clients yes
