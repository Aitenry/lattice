# =============================================================================
# Lattice production TLS — SealedSecret shape example (**empty-shell example, must not be applied directly**)
# -----------------------------------------------------------------------------
# Purpose: under GitOps, certificates/passwords never enter git. This file only demonstrates the **manifest
#       shape and metadata conventions**; the values of `spec.encryptedData` must be produced by `kubeseal`
#       on a machine that can reach the cluster public key. The `REPLACE_WITH_KUBESEAL_OUTPUT_*` values in
#       the repository are deliberately invalid placeholders (the controller rejects them, so it will not
#       silently create empty Secrets).
#
# How to generate (one per Secret):
#   kubectl -n lattice create secret generic lattice-node-grpc-tls \
#     --from-file=server.crt=./server.crt --from-file=server.key=./server.key \
#     --from-file=ca.crt=./ca.crt --dry-run=client -o yaml > .dev/grpc-tls.yaml
#   kubeseal --format yaml --cert ./sealed-secrets-pub.pem \
#     < .dev/grpc-tls.yaml > deploy/production/tls/sealed/node-grpc-tls.sealed.yaml
#
# Verification (offline):
#   scripts/ha-prod-validate.py checks this file's YAML structure and whether the namespace/name binding
#   matches the Helm contract; real decryption/controller behavior is unvalidated (no sealed-secrets on
#   this machine).
# =============================================================================
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: lattice-node-grpc-tls
  namespace: lattice
  labels:
    app.kubernetes.io/name: lattice
    app.kubernetes.io/component: tls
  annotations:
    # Example-file marker: production git must hold real kubeseal output (do not deploy this file)
    lattice.io/example: "REPLACE_WITH_KUBESEAL_OUTPUT"
spec:
  # template determines the name/type/labels of the Secret produced by decryption; key names must match
  # the chart contract.
  template:
    metadata:
      name: lattice-node-grpc-tls
      namespace: lattice
      labels:
        app.kubernetes.io/name: lattice
        app.kubernetes.io/component: node
    type: Opaque
  encryptedData:
    server.crt: REPLACE_WITH_KUBESEAL_OUTPUT_SERVER_CRT
    server.key: REPLACE_WITH_KUBESEAL_OUTPUT_SERVER_KEY
    ca.crt: REPLACE_WITH_KUBESEAL_OUTPUT_CA_CRT
---
# Same for business credentials (Helm secrets.existingSecret=lattice-prod-secrets):
# Key contract: pg-url / pg-replication-url / redis-url / s3-access-key / s3-secret-key /
#           admin-bootstrap-password
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: lattice-prod-secrets
  namespace: lattice
  labels:
    app.kubernetes.io/name: lattice
    app.kubernetes.io/component: secrets
  annotations:
    lattice.io/example: "REPLACE_WITH_KUBESEAL_OUTPUT"
spec:
  template:
    metadata:
      name: lattice-prod-secrets
      namespace: lattice
  encryptedData:
    pg-url: REPLACE_WITH_KUBESEAL_OUTPUT_PG_URL
    pg-replication-url: REPLACE_WITH_KUBESEAL_OUTPUT_PG_REPLICATION_URL
    redis-url: REPLACE_WITH_KUBESEAL_OUTPUT_REDIS_URL
    s3-access-key: REPLACE_WITH_KUBESEAL_OUTPUT_S3_ACCESS_KEY
    s3-secret-key: REPLACE_WITH_KUBESEAL_OUTPUT_S3_SECRET_KEY
    admin-bootstrap-password: REPLACE_WITH_KUBESEAL_OUTPUT_ADMIN_BOOTSTRAP_PASSWORD
