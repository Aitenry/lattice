{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "lattice.fullname" . }}
  labels:
    {{- include "lattice.labels" . | nindent 4 }}
  annotations:
    # WS/SSE need long connections: nginx ingress proxy-read-timeout overrides globally (the default 60s cuts the stream)
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-buffering: "off"
    {{- if and .Values.tls.enabled .Values.tls.certManager.enabled }}
    # cert-manager issues/renews for ingress.host (the Issuer is pre-created by operations; the chart creates no cluster-scoped resources)
    cert-manager.io/cluster-issuer: {{ .Values.tls.certManager.issuerRef.name | quote }}
    {{- end }}
    {{- with .Values.ingress.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  {{- if .Values.ingress.tls.enabled }}
  tls:
    - hosts:
        - {{ .Values.ingress.host | quote }}
      secretName: {{ include "lattice.ingressTlsSecretName" . }}
  {{- end }}
  rules:
    - host: {{ .Values.ingress.host | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "lattice.web.fullname" . }}
                port:
                  name: http
{{- end }}
