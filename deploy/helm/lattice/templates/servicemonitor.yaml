{{- if .Values.metrics.serviceMonitor.enabled }}
{{/*
 ServiceMonitor (Prometheus Operator). On clusters without the Operator, use static scraping in prometheus.yml
 with `<release>-lattice-node:9100` (see deploy/observability/prometheus/prometheus.yml).
*/}}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "lattice.node.fullname" . }}
  labels:
    {{- include "lattice.labels" . | nindent 4 }}
    {{- with .Values.metrics.serviceMonitor.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  selector:
    matchLabels:
      {{- include "lattice.node.selectorLabels" . | nindent 6 }}
  endpoints:
    - port: metrics
      interval: {{ .Values.metrics.serviceMonitor.interval }}
      path: /metrics
{{- end }}
