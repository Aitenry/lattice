{{/*
 Console web nginx site: same origin as deploy/nginx.conf, but the upstream uses the chart's Service name.
 Why not reuse the copy baked into the image: its upstream hardcodes `node:8080` (the compose service name),
 and in k8s the Service name is `<release>-lattice-node`, which the hardcoded name cannot resolve—this ConfigMap is mounted to override it.
*/}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "lattice.web.fullname" . }}-nginx
  labels:
    {{- include "lattice.labels" . | nindent 4 }}
    app.kubernetes.io/component: web
data:
  lattice.conf: |
    upstream lattice_node {
        server {{ include "lattice.node.fullname" . }}:{{ .Values.service.httpPort }};
        keepalive 32;
    }

    server {
        listen 80;
{{- if include "lattice.webTlsEnabled" . }}
        # extra TLS listener (direct-connect shape without an Ingress/LB); the certificate Secret mounts at /etc/nginx/tls (public/private key only)
        listen {{ .Values.tls.http.web.port }} ssl;
        ssl_certificate /etc/nginx/tls/tls.crt;
        ssl_certificate_key /etc/nginx/tls/tls.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_session_cache shared:SSL:10m;
{{- if .Values.tls.http.web.requireClientCert }}
        ssl_client_certificate /etc/nginx/tls/ca.crt;
        ssl_verify_client on;
{{- end }}
{{- end }}
        server_name _;

        root /usr/share/nginx/html;
        index index.html;

        client_max_body_size {{ .Values.web.clientMaxBodySize | default "8m" }};

        gzip on;
        gzip_types text/css application/javascript application/json image/svg+xml;
        gzip_min_length 1024;

        location /assets/ {
            expires 30d;
            add_header Cache-Control "public, immutable";
            try_files $uri =404;
        }

        location = /index.html {
            add_header Cache-Control "no-store";
        }

        # SSE: buffering must be off (⑤ §8.5), otherwise nginx holds events back
        location = /v1/admin/stream {
            proxy_pass http://lattice_node;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header Connection "";
            proxy_buffering off;
            proxy_cache off;
            chunked_transfer_encoding on;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        location /v1/ws {
            proxy_pass http://lattice_node;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
            proxy_buffering off;
        }

        location /v1/ {
            proxy_pass http://lattice_node;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location / {
            try_files $uri $uri/ /index.html;
        }
    }
