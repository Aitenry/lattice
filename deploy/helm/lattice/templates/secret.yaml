{{- if not .Values.secrets.existingSecret }}
{{/*
 Default Secret: created only when existingSecret is not provided. Key names are fixed (README "secret contract"):
  pg-url / redis-url / s3-access-key / s3-secret-key / admin-bootstrap-password
 Production strongly recommends existingSecret (managed by Vault/SealedSecrets/cloud KMS) rather than writing passwords into values.
*/}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "lattice.secretName" . }}
  labels:
    {{- include "lattice.labels" . | nindent 4 }}
    app.kubernetes.io/component: node
type: Opaque
stringData:
  pg-url: {{ default .Values.deps.pg.url .Values.secrets.pgUrl | quote }}
  # replication account URL: needed only by backup.pitr (pg_basebackup); a normal application account lacks the REPLICATION privilege
  pg-replication-url: {{ .Values.secrets.pgReplicationUrl | quote }}
  redis-url: {{ default .Values.deps.redis.url .Values.secrets.redisUrl | quote }}
  s3-access-key: {{ .Values.secrets.s3AccessKey | quote }}
  s3-secret-key: {{ .Values.secrets.s3SecretKey | quote }}
  admin-bootstrap-password: {{ .Values.secrets.adminBootstrapPassword | quote }}
{{- end }}
